<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytstudio</title>
<!-- SIN TIPOGRAFÍAS DE INTERNET. ytstudio es un programa LOCAL: se usa sin
     conexión y no debe pedirle nada a servidores ajenos. Cargar Cormorant y
     Lora desde Google bloqueaba el arranque hasta que la petición fallaba, y
     en un equipo sin internet el texto salía igualmente con la tipografía de
     respaldo. Aquí se declaran directamente las familias del sistema que dan
     ese mismo aire editorial: serif de título con carácter y serif de lectura
     cómoda, presentes en Windows, Mac y Linux. -->
<style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --text:#201f1d; --divider:#d8d5d2;
  --n300:#e4e1de; --n500:#8f8a83; --n600:#7a756e; --n700:#5d5952; --n800:#3a3733; --n900:#201f1d;
  --accent:#b68235; --a100:#f6efe4; --a200:#ecdcc4; --a700:#8f6526; --a800:#6d4d1d;
  --heading:"Cormorant Garamond","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#171614; --surface:#211f1c; --text:#f0eee9; --divider:#35322d;
  --n300:#3b3833; --n500:#726d65; --n600:#8d877e; --n700:#aaa49a; --n800:#d4cfc7; --n900:#f4f1ec;
  --accent:#c8974a; --a100:#2a2318; --a200:#3b2f1d; --a700:#d8ab61; --a800:#e5bf80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--a700);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
h1,h2,h3{font-family:var(--heading);font-weight:400;margin:0;letter-spacing:-0.01em}
::selection{background:var(--a200)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kicker{font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--n600)}
.mono{font:11px var(--mono)}
.muted{color:var(--n700)}
.btn{font-family:var(--heading);font-size:14px;background:transparent;color:var(--text);border:1px solid var(--divider);border-radius:4px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--a100)}
.btn:active{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{border-color:var(--accent);color:var(--a700)}
.btn-ghost{border-color:transparent;color:var(--n700)}
.btn-sm{font-size:12px;padding:5px 10px}
.tag{display:inline-block;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--a700);padding:4px 7px;border-radius:2px;white-space:nowrap}
.tag-quiet{border-color:var(--divider);color:var(--n600)}
.input{width:100%;font-family:var(--body);font-size:14px;background:transparent;color:var(--text);border:1px solid var(--divider);border-radius:4px;padding:9px 11px}
.input:focus{border-color:var(--accent);outline:none}
/* Los desplegables NO pueden ser transparentes: el navegador pinta la lista
   con su propio fondo y, en modo claro, el texto quedaba blanco sobre blanco
   (ilegible). Fondo y color explícitos, en el select y en cada opción. */
/* max-width evita que una opción larga («Documental cinematográfico») se
   desborde sobre el campo de al lado en la rejilla de ajustes. */
select.input{background:var(--surface);color:var(--text);appearance:auto;max-width:100%}
select.input option{background:var(--surface);color:var(--text)}
label.f{display:block;font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--n600);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--heading);font-weight:500;font-size:13px;text-align:left;color:var(--n700);border-bottom:1px solid var(--divider);padding:8px 10px 8px 0}
td{border-bottom:1px solid var(--divider);padding:10px 10px 10px 0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--a100)}
.bar{height:2px;background:var(--n300)}
.bar>i{display:block;height:2px;background:var(--accent)}
.plate{border:7px solid var(--surface);outline:1px solid var(--divider);background:repeating-linear-gradient(135deg,var(--n300) 0 7px,var(--surface) 7px 14px)}
header.top{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap}
nav.main{display:flex;gap:2px}
nav.main button{font-family:var(--heading);font-size:14px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--n700);padding:6px 10px;cursor:pointer}
nav.main button:hover{background:var(--a100)}
nav.main button[aria-current="true"]{color:var(--a700);border-bottom-color:var(--accent)}
.seg{display:flex;border:1px solid var(--divider);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--heading);font-size:12px;background:transparent;border:0;color:var(--n700);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--divider)}
.seg button[aria-pressed="true"]{background:var(--a100);color:var(--a700)}
/* Tarjetas de plataforma de «proyecto nuevo»: la elección más importante del
   video (proporción, duración, subtítulos) merece verse de un vistazo. */
.fmtcard[aria-pressed="true"]{border-color:var(--accent);background:var(--a100);color:var(--a800)}
main{padding:0}
.wrap{padding:26px 30px}
.split{display:grid;gap:0}
.rail{border-left:1px solid var(--divider);padding:18px 20px}
.railL{border-right:1px solid var(--divider)}
.phase{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:baseline;padding:9px 18px;border-top:1px solid var(--divider);font-size:14px}
.phase.on{background:var(--a100);border-left:2px solid var(--accent)}
.phase.on .nm{font-family:var(--heading);font-size:17px;color:var(--a800)}
.phase .n{font:10px var(--mono);color:var(--a700)}
.phase.todo .n{color:var(--n500)}
.phase.todo .nm{color:var(--n600)}
/* Pipeline COMPACTO: en un corto, la mitad de las fases duran segundos y no
   merecen una fila entera; se muestran como una línea fina. */
.phase.mini{padding:5px 18px;font-size:12.5px;opacity:.75}
.phase.mini .nm{font-size:12.5px}
/* Marco de teléfono para el video final vertical: sin él, un Reel se veía
   estirado a todo el ancho de la columna. */
.vframe{margin:0 auto;max-width:340px;border:9px solid var(--n800);border-radius:22px;overflow:hidden;background:#000}
.card{border:1px solid var(--divider);border-radius:4px}
.warn{border:1px solid var(--accent);border-left:3px solid var(--accent);padding:14px 16px}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px}
.log{font:11px/1.85 var(--mono);color:var(--n700);max-height:210px;overflow:auto;white-space:pre-wrap}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.hide{display:none!important}
@media (max-width:1100px){.split{grid-template-columns:1fr!important}.rail,.railL{border:0;border-top:1px solid var(--divider)}}
@media (max-width:640px){.wrap{padding:18px 16px}header.top{padding:10px 14px;gap:10px}nav.main button{padding:8px 8px;min-height:44px}.btn{min-height:44px}}
</style>
</head>
<body>
<header class="top">
  <span style="font-family:var(--heading);font-size:21px;color:var(--n900)">ytstudio</span>
  <span style="width:1px;height:20px;background:var(--divider)"></span>
  <nav class="main" id="nav">
    <button data-go="proyectos" aria-current="true">Proyectos</button>
    <button data-go="canales">Canales</button>
    <button data-go="biblioteca">Biblioteca</button>
    <button data-go="ajustes">Ajustes</button>
  </nav>
  <span id="crumb" class="muted" style="font-family:var(--heading);font-size:17px"></span>
  <span style="flex:1"></span>
  <span id="ver" class="mono muted"></span>
  <div class="seg" id="ayuda">
    <button id="btn-manual" title="Guía completa de uso del programa">📖 Manual de uso</button>
    <button id="btn-eventos" title="Todo lo que ha hecho el programa, para diagnosticar un problema">Log de eventos</button>
  </div>
  <div class="seg" id="theme">
    <button data-theme="light" aria-pressed="true">Claro</button>
    <button data-theme="dark" aria-pressed="false">Oscuro</button>
  </div>
  <button class="btn btn-primary" id="new">Nuevo proyecto</button>
</header>

<div id="offline" class="hide" style="padding:12px 22px;border-bottom:1px solid var(--divider);background:var(--a100)">
  <span id="offlineTag" class="tag">Sin conexión al motor</span>
  <span id="offlineMsg" style="margin-left:10px;font-size:14px">No responde el servidor local. La corrida sigue en disco y se retoma al reconectar.</span>
  <button class="btn btn-sm" id="retry" style="margin-left:10px">Reintentar</button>
</div>

<main id="view"></main>

<script>
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
};
const fmtSec = s => s == null ? '—' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const money = v => v == null ? '—' : `$${Number(v).toFixed(2)}`;
const dateOf = ts => ts ? new Date(ts * 1000).toLocaleDateString('es', { day: '2-digit', month: 'short' }) : '—';

const S = { screen: 'proyectos', slug: null, cfg: null, projects: [], detail: null, run: null, lib: null, script: null, timer: null, offline: false, fail: null };

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) {
    let msg = `Error ${r.status}`;
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
async function safe(fn) {
  try { const v = await fn(); setFail(null); return v; }
  catch (e) {
    setFail(e instanceof TypeError
      ? { kind: 'offline', text: 'No responde el servidor local. La corrida sigue en disco y se retoma al reconectar.' }
      : { kind: 'server', text: e.message });
  }
}
function setFail(f) {
  S.fail = f;
  S.offline = !!f;
  const box = $('#offline');
  box.classList.toggle('hide', !f);
  if (f) {
    $('#offlineTag').textContent = f.kind === 'offline' ? 'Sin conexión al motor' : 'El servidor respondió con error';
    $('#offlineMsg').textContent = f.text;
  }
}
function setOffline(v) { setFail(v ? { kind: 'offline', text: 'No responde el servidor local.' } : null); }

/* ---------- tema ---------- */
const theme = localStorage.getItem('ytstudio.theme') || 'light';
applyTheme(theme);
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('ytstudio.theme', t);
  for (const b of $('#theme').children) b.setAttribute('aria-pressed', String(b.dataset.theme === t));
}
$('#theme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.theme); });

/* ---------- navegación ---------- */
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.go); });
$('#new').addEventListener('click', () => go('nuevo'));
$('#retry').addEventListener('click', boot);
$('#btn-manual').addEventListener('click', showManual);
$('#btn-eventos').addEventListener('click', showEvents);

function go(screen, slug) {
  S.screen = screen;
  if (slug !== undefined) S.slug = slug;
  clearInterval(S.timer); S.timer = null;
  for (const b of $('#nav').children) {
    const own = { proyectos: ['proyectos', 'nuevo', 'corrida', 'guion', 'escenas', 'personajes', 'metadatos'], canales: ['canales'], biblioteca: ['biblioteca'], ajustes: ['ajustes'] }[b.dataset.go];
    b.setAttribute('aria-current', String(own.includes(screen)));
  }
  $('#crumb').textContent = ['corrida', 'material', 'guion', 'escenas', 'personajes', 'metadatos'].includes(screen) ? (S.detail?.display_name || S.slug || '') : '';
  render();
  if (['material', 'escenas', 'personajes', 'metadatos'].includes(screen) && !S.detail) pollRun();
  if (screen === 'corrida') { pollRun(); S.timer = setInterval(pollRun, 2500); }
  if (screen === 'canales') loadLibrary();
  if (screen === 'guion') loadScript();
}

// La versión de la cabecera es un BOTÓN: abre el registro de cambios. Además
// avisa de los dos estados que confunden al actualizar — que el proceso en
// marcha sea más viejo que los archivos (hay que reiniciar) y que haya
// archivos del programa modificados sin guardar.
function pintarVersion() {
  const v = S.cfg?.version || {};
  const nodo = $('#ver');
  nodo.replaceChildren();
  const viejo = S.cfg?.server_version && S.cfg.server_version !== v.version;
  nodo.append(el('button', {
    class: 'btn btn-ghost btn-sm', style: 'font:11px var(--mono)',
    title: 'Ver qué trae cada versión del programa',
    onclick: showChangelog,
  }, [v.version, v.date].filter(Boolean).join(' · ') || 'versión'));
  if (viejo) nodo.append(el('span', { class: 'tag', style: 'margin-left:8px', title: `Los archivos están en ${v.version} pero el proceso corre ${S.cfg.server_version}.` }, 'actualización NO aplicada: reinicia'));
  if (v.modified) {
    const cuales = (v.modified_files || []).join('\n');
    nodo.append(el('span', { class: 'tag tag-quiet', style: 'margin-left:8px', title: cuales || '' },
      `${v.modified_count} archivo(s) del programa modificados`));
  }
}

/* ---------- carga ---------- */
async function boot() {
  await safe(async () => {
    S.cfg = await api('/api/config');
    pintarVersion();
    S.projects = await api('/api/projects');
  });
  render();
}
async function loadProjects() { await safe(async () => { S.projects = await api('/api/projects'); }); render(); }
async function loadLibrary() { await safe(async () => { S.lib = await api('/api/library'); }); render(); }
async function loadScript() {
  S.script = null; S.scriptError = null;
  await safe(async () => {
    try { S.script = (await api(`/api/projects/${S.slug}/script`)).content; }
    catch (e) { if (e instanceof TypeError) throw e; S.scriptError = e.message; }
  });
  render();
}
async function pollRun() {
  await safe(async () => {
    const [detail, run] = await Promise.all([
      api(`/api/projects/${S.slug}`),
      api(`/api/projects/${S.slug}/log`)
    ]);
    S.detail = detail; S.run = run;
    if (!run.running && S.timer) { clearInterval(S.timer); S.timer = null; }
  });
  if (S.screen === 'corrida') render();
}

/* ---------- pantallas ---------- */
function render() {
  const v = $('#view'); v.textContent = '';
  if (S.fail && !S.cfg) { v.append(viewFallo()); return; }
  const fn = ({ proyectos: viewProyectos, nuevo: viewNuevo, corrida: viewCorrida, material: viewMaterial, guion: viewGuion, escenas: viewEscenas, personajes: viewPersonajes, metadatos: viewMetadatos, canales: viewCanales, biblioteca: viewBiblioteca, ajustes: viewAjustes })[S.screen] || viewProyectos;
  try { v.append(fn()); }
  catch (e) { v.append(viewFallo(e.message)); }
}

function viewFallo(extra) {
  const f = S.fail || {};
  return el('div', { class: 'center' },
    el('div', { style: 'max-width:520px' },
      el('div', { class: 'kicker', style: 'color:var(--a700)' }, f.kind === 'server' ? 'El servidor respondió con error' : 'Sin conexión al motor local'),
      el('h1', { style: 'font-size:30px;margin-top:12px;line-height:1.25' }, f.kind === 'server' ? 'La interfaz está viva, el servidor rechazó la petición' : 'La interfaz está viva, el motor no responde'),
      el('p', { class: 'muted', style: 'line-height:1.75;margin-top:12px' }, extra || f.text || 'Arranca el servidor con «python -m ytstudio ui» y vuelve a intentar. Nada se pierde: las corridas viven en disco.')),
    el('button', { class: 'btn btn-primary', onclick: boot }, 'Reintentar'));
}

function viewProyectos() {
  if (!S.projects.length) {
    return el('div', { class: 'center' },
      el('div', { style: 'max-width:540px' },
        el('div', { class: 'kicker' }, 'Sin proyectos todavía'),
        el('h1', { style: 'font-size:34px;margin-top:14px;line-height:1.2' }, 'Escribe un tema y el sistema hace el resto'),
        el('p', { class: 'muted', style: 'line-height:1.75;margin-top:14px' }, `${(S.cfg?.phases || []).length || 11} fases, de la investigación al video montado con voz, imágenes, música y subtítulos. Verás el costo estimado antes de gastar nada.`)),
      el('div', { style: 'display:flex;gap:10px' },
        el('button', { class: 'btn btn-primary', onclick: () => go('nuevo') }, 'Crear el primer video'),
        el('button', { class: 'btn', onclick: () => go('canales') }, 'Configurar un canal primero')));
  }
  const running = S.projects.filter(p => p.running).length;
  const body = el('tbody');
  for (const p of S.projects) {
    const estado = p.running ? `generando${p.phaseLabel || ''}` : p.has_error ? 'con error' : p.done === p.total ? 'listo' : 'borrador';
    body.append(el('tr', { class: 'row', onclick: () => go('corrida', p.slug) },
      el('td', { style: 'width:96px;padding-right:14px' }, thumb(p, 84)),
      el('td', {},
        el('div', { style: 'font-family:var(--heading);font-size:17px' }, p.display_name || p.slug),
        el('div', { style: 'margin-top:4px' }, fmtBadges(p))),
      el('td', {}, p.running ? el('span', { class: 'tag' }, estado) : el('span', { class: 'tag tag-quiet' }, estado)),
      el('td', { class: 'mono', style: 'text-align:right' }, `${p.done}/${p.total}`),
      el('td', { class: 'mono', style: 'text-align:right' }, p.scene_count ? `${p.scene_count} esc.` : '—'),
      el('td', { class: 'mono', style: 'text-align:right' }, p.total_duration ? fmtSec(p.total_duration) : '—'),
      el('td', { class: 'mono muted', style: 'text-align:right' }, dateOf(p.created_at))));
  }
  return el('div', { class: 'wrap' },
    el('div', { style: 'display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap' },
      el('div', {},
        el('div', { class: 'kicker' }, `${S.projects.length} proyectos · ${running} en curso`),
        el('h1', { style: 'font-size:34px;margin-top:10px' }, 'Proyectos')),
      el('input', { class: 'input', style: 'width:260px', placeholder: 'Buscar…', oninput: e => {
        const q = e.target.value.toLowerCase();
        for (const tr of body.children) tr.classList.toggle('hide', !tr.textContent.toLowerCase().includes(q));
      } })),
    el('table', { style: 'margin-top:20px' },
      el('thead', {}, el('tr', {},
        el('th', {}, ''), el('th', {}, 'Proyecto'), el('th', {}, 'Estado'),
        el('th', { style: 'text-align:right' }, 'Fases'),
        el('th', { style: 'text-align:right' }, 'Escenas'),
        el('th', { style: 'text-align:right' }, 'Duración'),
        el('th', { style: 'text-align:right' }, 'Creado'))),
      body));
}

function viewNuevo() {
  const formats = Object.entries(S.cfg?.formats || { long: { label: 'Video largo' } });
  const presets = Object.entries(S.cfg?.style_presets || {});
  const plantillas = Object.entries(S.cfg?.short_templates || {});
  const misEstilos = S.lib?.styles || [];
  const misCanales = S.lib?.channels || [];
  const st = { format: 'long', preset: presets[0]?.[0], style_id: '', short_template: 'libre' };
  const err = el('div', { class: 'muted', style: 'font-size:13px' });
  const nombre = el('input', { class: 'input', placeholder: 'alejandro-magno' });
  const texto = el('textarea', { class: 'input', rows: '7', placeholder: 'Escribe el tema o pega el material de partida…' });

  // TARJETAS DE PLATAFORMA: la primera decisión del video es para dónde es,
  // porque cambia la proporción, la duración y hasta los subtítulos.
  const bloqueTpl = el('div', { class: 'hide' });
  const tarjetas = formats.map(([k, f]) => el('button', {
    class: 'fmtcard btn', 'data-fmt': k, 'aria-pressed': String(k === st.format),
    style: 'text-align:left;padding:12px 14px;line-height:1.45;height:auto;white-space:normal',
    onclick: () => pickFormat(k),
  }, f.label || k));
  const rejilla = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px' }, tarjetas);
  // El <select> oculto mantiene la compatibilidad de lo que se envía al crear.
  // <select id="np-format" style="display:none"> — el desplegable oculto que
  // conserva la compatibilidad de lo que se envía al crear el proyecto.
  const selFormato = el('select', { id: 'np-format', style: 'display:none' },
    formats.map(([k]) => el('option', { value: k }, k)));

  function pickFormat(k) {
    st.format = k;
    selFormato.value = k;
    for (const t of tarjetas) t.setAttribute('aria-pressed', String(t.dataset.fmt === k));
    toggleTplSel();
  }
  function toggleTplSel() {
    // Las plantillas narrativas solo aplican a los formatos cortos.
    bloqueTpl.classList.toggle('hide', st.format === 'long' || !plantillas.length);
  }

  const selTpl = el('select', { id: 'np-template', class: 'input', style: 'width:auto',
    onchange: e => { st.short_template = e.target.value; } },
    plantillas.map(([k, t]) => el('option', { value: k, selected: k === 'libre' ? 'selected' : null }, t.label || k)));
  const notaTpl = el('div', { class: 'muted', style: 'font-size:12px;margin-top:5px;line-height:1.5' });
  selTpl.addEventListener('change', () => {
    notaTpl.textContent = (S.cfg?.short_templates?.[selTpl.value] || {}).hint || '';
  });
  bloqueTpl.append(el('label', { class: 'f' }, 'Plantilla narrativa del corto'), selTpl, notaTpl);

  // TUS estilos guardados, agrupados por canal, además de los de fábrica.
  const selEstilo = el('select', { class: 'input', style: 'width:auto', onchange: e => { st.style_id = e.target.value; } },
    el('option', { value: '' }, 'Ninguno — usar solo el estilo visual de abajo'),
    misCanales.map(c => {
      const hijos = misEstilos.filter(s => s.channel_id === c.id);
      return hijos.length ? el('optgroup', { label: c.name || c.id },
        hijos.map(s => el('option', { value: s.id }, s.name || s.id))) : null;
    }).filter(Boolean),
    (() => {
      const sueltos = misEstilos.filter(s => !s.channel_id || !misCanales.some(c => c.id === s.channel_id));
      return sueltos.length ? el('optgroup', { label: 'Sin canal' }, sueltos.map(s => el('option', { value: s.id }, s.name || s.id))) : null;
    })());

  const crear = async (runAfter) => {
    err.textContent = '';
    try {
      const body = { slug: nombre.value.trim(), text: texto.value.trim(),
                     format: st.format, style_preset: st.preset };
      if (st.style_id) body.style_id = st.style_id;
      if (st.format !== 'long') body.short_template = st.short_template;
      const r = await api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
      if (runAfter) await api(`/api/projects/${r.slug}/run`, { method: 'POST', body: JSON.stringify({}) });
      await loadProjects();
      go('corrida', r.slug);
    } catch (e) { err.textContent = e.message; }
  };
  const segPreset = el('div', { class: 'seg', style: 'flex-wrap:wrap' }, presets.map(([k, p]) => el('button', { 'aria-pressed': String(k === st.preset), onclick: e => { st.preset = k; for (const b of segPreset.children) b.setAttribute('aria-pressed', String(b === e.target)); } }, (p && (p.label || p.name)) || k)));
  toggleTplSel();
  return el('div', { class: 'wrap', style: 'max-width:820px' },
    el('div', { class: 'kicker' }, 'Paso 1 de 1 · el resto lo decide el sistema'),
    el('h1', { style: 'font-size:34px;margin-top:10px' }, '¿Para dónde es este video?'),
    el('p', { class: 'muted', style: 'font-size:13px;line-height:1.7;margin-top:10px;max-width:66ch' },
      'Es la primera decisión porque cambia todo lo demás: la proporción de la imagen, la duración objetivo, el ritmo de las escenas y si los subtítulos van incrustados.'),
    el('div', { style: 'display:flex;flex-direction:column;gap:20px;margin-top:22px' },
      el('div', {}, rejilla, selFormato),
      bloqueTpl,
      el('div', {}, el('label', { class: 'f' }, 'Nombre del proyecto'), nombre),
      el('div', {}, el('label', { class: 'f' }, 'Tema o material'), texto),
      misEstilos.length ? el('div', {},
        el('label', { class: 'f' }, 'Tu estilo guardado (canal)'), selEstilo,
        el('div', { class: 'muted', style: 'font-size:12px;margin-top:5px;line-height:1.5' },
          'Aplica la identidad de uno de tus canales: dirección visual, tono, música, ritmo y branding de rótulos.')) : null,
      presets.length ? el('div', {}, el('label', { class: 'f' }, 'Estilo visual de fábrica'), segPreset) : null,
      el('div', { style: 'display:flex;gap:10px;align-items:center;border-top:1px solid var(--divider);padding-top:16px' },
        el('button', { class: 'btn btn-primary', onclick: () => crear(true) }, 'Crear y generar'),
        el('button', { class: 'btn', onclick: () => crear(false) }, 'Solo crear'),
        err)));
}

function viewCorrida() {
  const d = S.detail, run = S.run || {};
  if (!d) return el('div', { class: 'center' }, el('div', { class: 'kicker' }, 'Cargando la corrida…'));
  const phases = S.cfg?.phases || [];
  const cur = run.phase;
  const list = el('div', {});
  // PIPELINE COMPACTO en los cortos: estas fases duran segundos y no merecen
  // una fila entera compitiendo con las que de verdad tardan y cuestan.
  const light = new Set(['ingest', 'metadata', 'publish', 'subtitles', 'music']);
  const esCorto = (d.format || 'long') !== 'long';
  phases.forEach((ph, i) => {
    const status = d.phases?.[ph.name];
    const on = cur === ph.name;
    const mini = esCorto && !on && light.has(ph.name);
    const row = el('div', { class: 'phase' + (mini ? ' mini' : '') + (on ? ' on' : status === 'done' ? '' : ' todo') },
      el('span', { class: 'n' }, String(i + 1).padStart(2, '0')),
      el('span', { class: 'nm' }, ph.label || ph.name),
      el('span', { class: 'mono muted' }, on ? `${run.percent ?? 0} %` : status === 'done' ? 'listo' : status === 'failed' ? 'falló' : 'espera'));
    list.append(row);
    if (on) {
      list.append(el('div', { style: 'padding:0 18px 12px;background:var(--a100);border-left:2px solid var(--accent)' },
        el('div', { class: 'bar' }, el('i', { style: `width:${run.percent ?? 0}%` })),
        el('div', { class: 'mono', style: 'color:var(--a700);margin-top:6px' }, run.eta_seconds != null ? `${fmtSec(run.eta_seconds)} restante` : 'calculando…')));
    }
  });

  const warnings = d.warnings || [];
  const atencion = el('div', {});
  if (run.error) atencion.append(el('div', { class: 'warn', style: 'margin-bottom:14px' },
    el('div', { class: 'kicker', style: 'color:var(--a700)' }, 'La corrida se detuvo'),
    el('div', { style: 'font-family:var(--heading);font-size:19px;margin-top:6px' }, run.error),
    el('div', { style: 'display:flex;gap:8px;margin-top:10px' },
      el('button', { class: 'btn btn-sm btn-primary', onclick: () => runFrom(cur || undefined) }, 'Reintentar'),
      el('button', { class: 'btn btn-sm', onclick: () => runFrom() }, 'Reintentar desde el principio'))));
  if (!warnings.length && !run.error) atencion.append(el('div', { class: 'muted', style: 'font-size:13px' }, 'Nada pendiente. El sistema avisa solo cuando hace falta decidir.'));
  warnings.slice(0, 8).forEach(w => {
    const text = typeof w === 'string' ? w : (w.message || w.text || JSON.stringify(w));
    const kind = typeof w === 'object' ? (w.phase || w.kind || 'aviso') : 'aviso';
    atencion.append(el('div', { style: 'border-top:1px solid var(--divider);padding:11px 0' },
      el('div', { class: 'kicker' }, kind),
      el('div', { style: 'font-size:13px;line-height:1.6;margin-top:4px' }, text)));
  });

  const usage = d.usage_report || {};
  const total = usage.total_usd ?? usage.total ?? usage.usd;
  // El video final se ve en su proporción REAL: un vertical dentro de un marco
  // de teléfono en vez de estirado a lo ancho de la columna.
  const asp = aspectOf(d);
  const video = d.final_video
    ? el('div', { class: asp.vert ? 'vframe' : '', style: asp.vert ? 'max-height:72vh' : '' },
        el('video', { src: `/files/${S.slug}/${d.final_video}`, controls: '',
          style: `width:100%;display:block;aspect-ratio:${asp.w}/${asp.h}` }))
    : el('div', { class: 'plate', style: `aspect-ratio:${asp.w}/${asp.h};display:flex;align-items:flex-end;padding:12px${asp.vert ? ';max-height:72vh;margin:0 auto' : ''}` },
      el('span', { class: 'mono muted', style: 'background:var(--bg);padding:4px 6px' }, run.running ? 'montando…' : 'sin video todavía'));

  const acciones = el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
    run.running
      ? el('span', { class: 'tag' }, `generando · ${cur || 'iniciando'}`)
      : el('button', { class: 'btn btn-primary', onclick: () => runFrom() }, 'Generar video'),
    el('button', { class: 'btn btn-sm', onclick: () => go('guion') }, 'Editar guion'),
    el('button', { class: 'btn btn-sm', onclick: async () => {
      const name = prompt('Nombre nuevo del proyecto', S.detail?.display_name || S.slug);
      if (!name) return;
      try { await api(`/api/projects/${S.slug}/rename`, { method: 'PUT', body: JSON.stringify({ name }) }); await pollRun(); await loadProjects(); go('corrida'); }
      catch (e) { alert(e.message); }
    } }, 'Renombrar'),
    el('select', { class: 'input', style: 'width:auto;font-size:12px', onchange: e => e.target.value && runFrom(e.target.value) },
      el('option', { value: '' }, 'Rehacer desde…'),
      phases.map(p => el('option', { value: p.name }, p.label || p.name))));

  return el('div', { class: 'split', style: 'grid-template-columns:264px 1fr 320px' },
    el('aside', { class: 'railL' },
      el('div', { class: 'kicker', style: 'padding:16px 18px 8px' }, `Fases · ${phases.length}`),
      list,
      el('div', { style: 'padding:14px 18px' },
        el('button', { class: 'btn btn-sm', style: 'width:100%', onclick: () => { const l = $('#logbox'); l.classList.toggle('hide'); } }, 'Log de eventos'),
        el('div', { id: 'logbox', class: 'log hide', style: 'margin-top:10px' }, (run.lines || []).slice(-60).join('\n') || 'sin líneas'))),
    el('div', { class: 'wrap' },
      el('div', { style: 'display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap' },
        el('div', {},
          el('div', { class: 'kicker' }, `${d.done} de ${d.total} fases${d.scene_count ? ` · ${d.scene_count} escenas` : ''}`),
          el('h1', { style: 'font-size:32px;margin-top:8px' }, d.display_name || S.slug),
          tabBar('corrida')),
        acciones),
      el('div', { style: 'margin-top:18px' }, video),
      el('div', { style: 'display:flex;justify-content:space-between;margin-top:8px' },
        el('span', { class: 'muted', style: 'font-size:13px' }, d.metadata?.title || d.concept?.title || 'sin título todavía'),
        el('span', { class: 'mono muted' }, d.total_duration ? fmtSec(d.total_duration) : '—')),
      d.thumbnail ? el('div', { style: 'margin-top:20px' },
        el('div', { class: 'kicker', style: 'margin-bottom:8px' }, 'Miniatura'),
        el('img', { src: `/files/${S.slug}/${d.thumbnail}`, style: 'width:220px;display:block;border:6px solid var(--surface);outline:1px solid var(--divider)' })) : null),
    el('aside', { class: 'rail' },
      el('div', { style: 'display:flex;align-items:baseline;justify-content:space-between' },
        el('h2', { style: 'font-size:18px' }, 'Atención'),
        el('span', { class: 'tag' }, String(warnings.length + (run.error ? 1 : 0)))),
      el('div', { style: 'margin-top:12px' }, atencion),
      el('div', { class: 'kicker', style: 'margin:20px 0 8px;border-top:1px solid var(--divider);padding-top:16px' }, 'Gasto real'),
      total != null
        ? el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' },
          el('span', { style: 'font-family:var(--heading);font-size:16px' }, 'Total'),
          el('span', { style: 'font-family:var(--heading);font-size:20px;color:var(--a700)' }, money(total)))
        : el('div', { class: 'muted', style: 'font-size:13px' }, 'Se calcula al terminar cada fase.'),
      d.time_report ? el('div', { class: 'mono muted', style: 'margin-top:8px' }, `tiempo total ${fmtSec(d.time_report.total_seconds || d.time_report.total || null)}`) : null));
}

async function runFrom(from) {
  try {
    await api(`/api/projects/${S.slug}/run`, { method: 'POST', body: JSON.stringify(from ? { from } : {}) });
    pollRun(); if (!S.timer) S.timer = setInterval(pollRun, 2500);
  } catch (e) { alert(e.message); }
}

function viewGuion() {
  if (S.script === null) return el('div', { class: 'center' },
    el('div', { class: 'kicker' }, 'Guion'),
    el('p', { class: 'muted', style: 'max-width:460px;line-height:1.7' }, S.scriptError || 'Aún no hay guion. Genera hasta la fase de guion para poder editarlo.'),
    el('button', { class: 'btn', onclick: () => go('corrida') }, 'Volver a la corrida'));

  return el('div', { class: 'wrap', style: 'max-width:900px' },
    el('div', { style: 'display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap' },
      el('div', {}, el('div', { class: 'kicker' }, 'Editor de guion'), el('h1', { style: 'font-size:30px;margin-top:8px' }, S.detail?.display_name || S.slug)),
      el('div', { style: 'display:flex;gap:8px;align-items:center' }, msg,
        el('button', { class: 'btn', onclick: () => go('corrida') }, 'Cancelar'),
        el('button', { class: 'btn btn-primary', onclick: async () => {

    el('div', { class: 'muted', style: 'font-size:13px;margin-top:10px' }, 'Guardar invalida escenas, voz y montaje: el sistema los rehace desde aquí.'));

// FORMULARIO DE ESTILO. Un estilo guarda la identidad de un canal —dirección
// visual, tono, música, ritmo, fórmula narrativa y branding de rótulos— para
// no volver a pagar el análisis en cada video. En el rediseño no había forma
// de crear ni editar ninguno: las tarjetas eran decorativas.
function styleForm(estilo) {
  const e = estilo || {};
  const campos = {};
  const canales = (S.lib?.channels || []);
  const fuentes = S.cfg?.overlay_font_families || {};
  const presets = S.cfg?.overlay_branding_presets || {};

  const texto = (k, label, hint, filas) => {
    const n = filas
      ? el('textarea', { class: 'input', rows: String(filas), value: e[k] || '' })
      : el('input', { class: 'input', value: e[k] ?? '' });
    if (filas) n.value = e[k] || '';
    campos[k] = () => n.value.trim();
    return el('div', {}, el('label', { class: 'f' }, label), n,
      hint ? el('div', { class: 'muted', style: 'font-size:12px;margin-top:4px;line-height:1.5' }, hint) : null);
  };
  const color = (k, label) => {
    const hex = el('input', { class: 'input', style: 'width:110px', placeholder: 'E8C46B', value: e[k] || '' });
    campos[k] = () => hex.value.trim().replace(/^#/, '');
    return el('div', {}, el('label', { class: 'f' }, label),
      el('div', { style: 'display:flex;gap:8px;align-items:center' }, hex,
        el('span', { class: 'muted', style: 'font-size:12px' }, 'color en hexadecimal, sin #')));
  };
  const lista = (k, label, opciones, hint) => {
    const s = el('select', { class: 'input', style: 'width:auto' },
      opciones.map(o => el('option', { value: o.v, selected: (e[k] || '') === o.v ? 'selected' : null }, o.t)));
    campos[k] = () => s.value || null;
    return el('div', {}, el('label', { class: 'f' }, label), s,
      hint ? el('div', { class: 'muted', style: 'font-size:12px;margin-top:4px' }, hint) : null);
  };

  const nombre = el('input', { class: 'input', value: e.name || '', placeholder: 'Documental de naturaleza' });
  const canalSel = el('select', { class: 'input', style: 'width:auto' },
    el('option', { value: '' }, 'Sin canal'),
    canales.map(c => el('option', { value: c.id, selected: e.channel_id === c.id ? 'selected' : null }, c.name || c.id)));

  const bloqueFuente = lista('overlay_font_family', 'Tipografía de los rótulos',
    [{ v: '', t: 'Por defecto del programa' }, ...Object.entries(fuentes).map(([k, f]) => ({ v: k, t: f.label }))],
    Object.values(fuentes).map(f => f.hint).filter(Boolean)[0] ? 'Cada familia da un aire distinto al video.' : '');
  const bloqueEstilo = lista('overlay_style', 'Diseño del rótulo',
    [{ v: '', t: 'Por defecto (documental)' },
     { v: 'documental', t: 'Documental — placa oscura sobria' },
     { v: 'minimal', t: 'Minimal — sin placa, solo filete' },
     { v: 'bold', t: 'Bold — placa del color de acento, máxima presencia' }]);
  const acento = color('overlay_accent', 'Color de acento');
  const textoCol = color('overlay_text_color', 'Color del texto');

  const applyBrandingPreset = k => {
    const p = presets[k]; if (!p) return;
    const set = (sel, val) => { const n = sel.querySelector('select, input'); if (n) n.value = val || ''; };
    set(bloqueFuente, p.overlay_font_family);
    set(bloqueEstilo, p.overlay_style);
    set(acento, p.overlay_accent);
    set(textoCol, p.overlay_text_color);
  };

  const cuerpo = el('div', { style: 'display:flex;flex-direction:column;gap:16px' },
    el('div', {}, el('label', { class: 'f' }, 'Nombre del estilo'), nombre),
    el('div', {}, el('label', { class: 'f' }, 'Canal al que pertenece'), canalSel),
    texto('visual_description', 'Dirección visual', 'Cómo se ven las imágenes: luz, paleta, tipo de plano, textura.', 3),
    texto('prompt_prefix', 'Prefijo para las imágenes', 'Se antepone a cada descripción que se manda al modelo de imagen.', 2),
    texto('palette', 'Paleta', 'Colores dominantes, separados por comas.'),
    texto('tone', 'Tono de la narración', 'Cómo habla el narrador: sobrio, épico, cercano…', 2),
    texto('music_mood', 'Ánimo de la música'),
    texto('music_description', 'Descripción de la música', '', 2),
    texto('formula', 'Fórmula narrativa', 'La estructura que repite el canal: gancho, desarrollo, giro, cierre.', 3),
    el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px' },
      texto('scene_seconds', 'Segundos por escena'),
      lista('transition', 'Transición',
        [{ v: '', t: 'Automática' }, { v: 'fade', t: 'Fundido' }, { v: 'none', t: 'Corte' }])),
    el('div', { style: 'border-top:1px solid var(--divider);padding-top:16px' },
      el('div', { class: 'kicker' }, 'Branding de los rótulos'),
      Object.keys(presets).length ? el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px' },
        Object.entries(presets).map(([k, p]) => el('button', { class: 'btn btn-sm', onclick: () => applyBrandingPreset(k) }, p.label))) : null,
      el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px' },
        bloqueFuente, bloqueEstilo, acento, textoCol)));

  const err = el('div', { class: 'muted', style: 'font-size:13px' });
  const guardar = async () => {
    const body = { name: nombre.value.trim(), channel_id: canalSel.value || null };
    for (const [k, leer] of Object.entries(campos)) body[k] = leer();
    if (body.scene_seconds === '') body.scene_seconds = null;
    if (!body.name) { err.textContent = 'El estilo necesita un nombre.'; return; }
    try {
      if (e.id) await api(`/api/styles/${e.id}`, { method: 'POST', body: JSON.stringify(body) });
      else await api('/api/styles', { method: 'POST', body: JSON.stringify(body) });
      ov.remove(); await loadLibrary();
    } catch (x) { err.textContent = x.message; }
  };
  const ov = overlay(e.id ? 'Editar estilo' : 'Estilo nuevo',
    el('div', {}, cuerpo,
      el('div', { style: 'display:flex;gap:10px;align-items:center;margin-top:20px;border-top:1px solid var(--divider);padding-top:16px' },
        el('button', { class: 'btn btn-primary', onclick: guardar }, 'Guardar estilo'),
        e.id ? el('button', { class: 'btn', onclick: async () => {
          if (!confirm(`¿Borrar el estilo «${e.name}»? Los videos ya hechos con él no se tocan.`)) return;
          try { await api(`/api/styles/${e.id}`, { method: 'DELETE' }); ov.remove(); await loadLibrary(); }
          catch (x) { err.textContent = x.message; }
        } }, 'Borrar') : null,
        err)), 780);
  return ov;
}

function channelForm(canal) {
  const c = canal || {};
  const nombre = el('input', { class: 'input', value: c.name || '', placeholder: 'Historia en 10 minutos' });
  const desc = el('textarea', { class: 'input', rows: '3' });
  desc.value = c.description || '';
  const err = el('div', { class: 'muted', style: 'font-size:13px' });
  const guardar = async () => {
    const body = { name: nombre.value.trim(), description: desc.value.trim() };
    if (!body.name) { err.textContent = 'El canal necesita un nombre.'; return; }
    try {
      if (c.id) await api(`/api/channels/${c.id}`, { method: 'POST', body: JSON.stringify(body) });
      else await api('/api/channels', { method: 'POST', body: JSON.stringify(body) });
      ov.remove(); await loadLibrary();
    } catch (x) { err.textContent = x.message; }
  };
  const ov = overlay(c.id ? 'Editar canal' : 'Canal nuevo',
    el('div', { style: 'display:flex;flex-direction:column;gap:16px' },
      el('div', {}, el('label', { class: 'f' }, 'Nombre del canal'), nombre),
      el('div', {}, el('label', { class: 'f' }, 'Descripción'), desc),
      el('div', { style: 'display:flex;gap:10px;align-items:center;border-top:1px solid var(--divider);padding-top:16px' },
        el('button', { class: 'btn btn-primary', onclick: guardar }, 'Guardar canal'),
        c.id ? el('button', { class: 'btn', onclick: async () => {
          if (!confirm(`¿Borrar el canal «${c.name}»? Sus estilos quedan sin canal, no se borran.`)) return;
          try { await api(`/api/channels/${c.id}`, { method: 'DELETE' }); ov.remove(); await loadLibrary(); }
          catch (x) { err.textContent = x.message; }
        } }, 'Borrar') : null,
        err)), 560);
  return ov;
}

function styleCard(s) {
  return el('div', { class: 'card', style: 'padding:15px 16px;cursor:pointer;border-color:var(--accent)', onclick: () => styleForm(s) },
    el('div', { class: 'kicker', style: 'color:var(--a700)' }, 'estilo'),
    el('div', { style: 'font-family:var(--heading);font-size:19px;margin-top:5px' }, s.name || s.id),

async function bankUpload(categoria) {
  pickFile('image/*,video/*', async files => {

      for (const f of files) await api('/api/elements', { method: 'POST', body: JSON.stringify({ category: categoria, file: f }) });

}

// PROPORCIÓN REAL del proyecto: un Reel se ve como teléfono vertical y un
// anuncio cuadrado como cuadrado, en vez de forzarlo todo a 16:9.
function aspectOf(p) {
  const a = p.video_aspect || { w: 1920, h: 1080 };
  return { w: a.w || 1920, h: a.h || 1080, vert: (a.h || 0) > (a.w || 0) };
}

// Ficha visual de un proyecto: su MINIATURA de verdad si ya existe, y si no
// una placa con el motivo. Antes siempre salía la placa decorativa, así que
// todos los proyectos se veían iguales y no había forma de reconocerlos.
function thumbStyle(p, base) {
  const a = aspectOf(p);
  const w = a.vert ? Math.round((base || 230) * 0.62)
          : (a.w === a.h ? Math.round((base || 230) * 0.8) : (base || 230));
  return `width:${w}px;height:auto;aspect-ratio:${a.w}/${a.h};object-fit:cover;border:1px solid var(--divider);border-radius:3px`;
}

function thumb(p, ancho) {
  const a = aspectOf(p);
  const w = a.vert ? Math.round((ancho || 230) * 0.62) : (a.w === a.h ? Math.round((ancho || 230) * 0.8) : (ancho || 230));
  const estilo = thumbStyle(p, ancho);
  if (p.thumbnail && p.slug) return el('img', { src: `/files/${p.slug}/${p.thumbnail}?v=${p.done || 0}`, loading: 'lazy', style: estilo, alt: p.display_name || p.slug });
  return el('div', { class: 'plate', style: `width:${w}px;aspect-ratio:${a.w}/${a.h};display:flex;align-items:center;justify-content:center` },
    el('span', { class: 'kicker', style: 'background:var(--bg);padding:3px 7px' },
      p.done === p.total ? 'sin miniatura' : 'en proceso'));
}

// Distintivos de formato y plantilla (un Short, un Reel, un anuncio…).

  const f = S.cfg?.formats?.[p.format];
  const t = p.short_template && p.short_template !== 'libre' ? S.cfg?.short_templates?.[p.short_template] : null;

// REGISTRO DE CAMBIOS al pulsar la versión de la cabecera. En el rediseño la
// versión era texto muerto: se perdió la ventana que cuenta qué trae cada
// versión del programa.
function overlay(titulo, contenido, ancho) {
  const caja = el('div', { class: 'card', style: `background:var(--bg);max-width:${ancho || 700}px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px` },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:-20px;background:var(--bg);padding:2px 0 12px' },
      el('h2', { style: 'font-size:23px' }, titulo),
      el('button', { class: 'btn btn-sm', onclick: () => ov.remove() }, 'Cerrar')),
    contenido);
  const ov = el('div', { style: 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px',
    onclick: e => { if (e.target === ov) ov.remove(); } }, caja);
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', esc); }
  });
  document.body.append(ov);
  return ov;
}

// Markdown mínimo: títulos, viñetas, tablas, negrita y código. El manual y el
// registro de cambios se escriben en Markdown, y sin esto salían como un
// bloque de texto plano con los asteriscos y las barras a la vista.
function mdInline(s) {
  return String(s)
    .replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    .replace(/`([^`]+)`/g, '<code style="font:11px var(--mono);background:var(--a100);padding:1px 4px;border-radius:3px">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
    // Las comillas se escapan también en el enlace: sin eso, una URL que
    // llevara una comilla cerraría el atributo href y lo que viniera detrás
    // se interpretaría como marcado. El manual es un archivo del programa,
    // pero un lector de Markdown no debe depender de que su entrada sea buena.
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,
      (_, t, u) => `<a href="${u.replace(/"/g, '&quot;')}" target="_blank" rel="noopener">${t}</a>`);
}

function mdToHtml(md) {
  const out = [];
  // El manual y el registro de cambios vienen con las líneas CORTADAS a 80
  // caracteres. Tratando cada línea como un párrafo, el texto salía roto a
  // media frase y una negrita partida en dos líneas no se cerraba nunca.
  // Primero se reúnen las líneas de continuación en su bloque lógico.
  const nuevoBloque = t => !t || /^(#{1,6} |[-*] |\d+\. |>|\||---|===)/.test(t);
  const lineas = [];
  for (const cruda of String(md || '').split('\n')) {
    const t = cruda.trim();
    if (!nuevoBloque(t) && lineas.length && lineas[lineas.length - 1]
        && !/^(#{1,6} |>|\||---|===)/.test(lineas[lineas.length - 1])) {
      lineas[lineas.length - 1] += ' ' + t;     // continúa el bloque anterior
    } else {
      lineas.push(t);
    }
  }
  let tabla = null;
  const cerrarTabla = () => { if (tabla) { out.push('<table>' + tabla.join('') + '</table>'); tabla = null; } };
  for (const l of lineas) {
    const t = l.trim();
    if (/^\|(.+)\|$/.test(t)) {
      const celdas = t.slice(1, -1).split('|').map(c => c.trim());
      if (celdas.every(c => /^:?-{2,}:?$/.test(c))) continue;   // la fila de guiones
      const th = tabla === null;
      tabla = tabla || [];
      tabla.push('<tr>' + celdas.map(c => th ? `<th>${mdInline(c)}</th>` : `<td>${mdInline(c)}</td>`).join('') + '</tr>');
      continue;
    }
    cerrarTabla();
    if (/^#{1,6} /.test(t)) {
      const n = t.match(/^#+/)[0].length;
      const tam = [30, 25, 20, 17, 16, 15][n - 1];
      out.push(`<h${Math.min(n, 4)} id="s-${out.length}" style="font-size:${tam}px;margin:22px 0 8px">${mdInline(t.replace(/^#+ /, ''))}</h${Math.min(n, 4)}>`);
    } else if (/^[-*] /.test(t)) {
      out.push(`<div style="margin:4px 0 4px 16px;line-height:1.65">• ${mdInline(t.slice(2))}</div>`);
    } else if (/^\d+\. /.test(t)) {
      out.push(`<div style="margin:4px 0 4px 16px;line-height:1.65">${mdInline(t)}</div>`);
    } else if (/^>/.test(t)) {
      out.push(`<div style="margin:8px 0;padding-left:12px;border-left:2px solid var(--accent);line-height:1.65">${mdInline(t.replace(/^>\s?/, ''))}</div>`);
    } else if (/^(---|===)/.test(t)) {
      out.push('<hr style="border:0;border-top:1px solid var(--divider);margin:18px 0">');
    } else if (t) {
      out.push(`<p style="margin:8px 0;line-height:1.7">${mdInline(t)}</p>`);
    }
  }
  cerrarTabla();
  return out.join('');
}

// VISOR DEL MANUAL, con índice lateral y buscador. El manual es largo y en
// Markdown: sin índice no se navega y sin tablas renderizadas se lee fatal.
// Avisa además si el manual se quedó atrás respecto al programa, porque
// entonces puede describir algo que ya cambió.
// Sin tildes y en minúsculas: nadie escribe «híbrido» con tilde en un
// buscador, y sin esto la búsqueda no encontraba nada y parecía rota.
function sinTildes(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function filterManual(q, cuerpo, toc, vacio) {
  const t = sinTildes(q).trim();
  let visibles = 0;
  for (const sec of cuerpo.querySelectorAll('[data-sec]')) {
    const oculta = !!t && !sinTildes(sec.textContent).includes(t);
    sec.classList.toggle('hide', oculta);
    if (!oculta) visibles++;
  }
  for (const a of toc.querySelectorAll('a')) {
    const destino = cuerpo.querySelector(`[data-sec="${a.dataset.sec}"]`);
    a.classList.toggle('hide', !!destino && destino.classList.contains('hide'));
  }
  if (vacio) vacio.classList.toggle('hide', visibles > 0);
}

async function showManual() {
  let r;
  try { r = await api('/api/manual'); }
  catch (e) { alert('No se pudo abrir el manual: ' + e.message); return; }
  const stale = r.manual_version && r.program_version && r.manual_version !== r.program_version;

  // El contenido se parte por secciones de primer/segundo nivel, para poder
  // filtrar y saltar de una a otra.
  const bloques = [];
  let actual = { titulo: 'Inicio', md: [] };
  for (const linea of String(r.content || '').split('\n')) {
    if (/^##? /.test(linea.trim())) { bloques.push(actual); actual = { titulo: linea.replace(/^#+\s*/, '').trim(), md: [linea] }; }
    else actual.md.push(linea);
  }
  bloques.push(actual);

  const cuerpo = el('div', { style: 'font-size:14px' });
  const toc = el('nav', { class: 'man-toc', style: 'position:sticky;top:0;align-self:start;max-height:64vh;overflow:auto;padding-right:14px;border-right:1px solid var(--divider);display:flex;flex-direction:column;gap:2px' });
  bloques.forEach((b, i) => {
    if (!b.md.join('').trim()) return;
    cuerpo.append(el('section', { 'data-sec': String(i), id: `man-${i}`, html: mdToHtml(b.md.join('\n')) }));
    toc.append(el('a', { href: `#man-${i}`, 'data-sec': String(i),
      style: 'font-size:12.5px;line-height:1.5;padding:3px 0;color:var(--n700)',
      onclick: ev => { ev.preventDefault(); cuerpo.querySelector(`#man-${i}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
      b.titulo));
  });

  const vacio = el('div', { class: 'muted hide', style: 'font-size:13px;padding:20px 0' },
    'Ninguna sección menciona eso. Prueba con una palabra más corta.');
  const buscador = el('input', { class: 'input', placeholder: 'Buscar en el manual…',
    oninput: e => filterManual(e.target.value, cuerpo, toc, vacio) });

  overlay('Manual de uso',

        toc, el('div', {}, vacio, cuerpo))),

// Casilla SÍ/NO con su explicación debajo. Muchos ajustes del programa son
// booleanos y necesitan una frase que diga qué hacen: sin ella, el nombre
// solo (p. ej. «ducking») no significa nada para quien no edita audio.
function check(label, value, onSet, hint) {
  return el('div', {},
    el('label', { style: 'display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer' },
      el('input', { type: 'checkbox', checked: value ? 'checked' : null, onchange: e => onSet(e.target.checked) }),
      label),
    hint ? el('div', { class: 'muted', style: 'font-size:12px;line-height:1.55;margin:4px 0 0 27px;max-width:60ch' }, hint) : null);
}

// FORMATOS DE SALIDA con la proporción protegida. Antes eran dos campos
// numéricos sueltos: bastaba rozar la flechita del ancho para dejar 1922x1080
// y sacar el video deformado. Ahora se elige un formato conocido y las dos
// medidas se fijan juntas; el modo libre existe, pero con candado de
// proporción para que al cambiar un lado el otro se recalcule.
const FORMATOS = [
  { w: 1920, h: 1080, t: '1920 × 1080 · 16:9 horizontal (YouTube)' },
  { w: 2560, h: 1440, t: '2560 × 1440 · 16:9 en 2K' },
  { w: 3840, h: 2160, t: '3840 × 2160 · 16:9 en 4K' },
  { w: 1080, h: 1920, t: '1080 × 1920 · 9:16 vertical (Shorts, Reels, TikTok)' },
  { w: 1080, h: 1080, t: '1080 × 1080 · 1:1 cuadrado (Meta Ads)' },
  { w: 1080, h: 1350, t: '1080 × 1350 · 4:5 retrato (feed de Instagram)' },
];

function formatoVideo(cfg, set) {
  const w0 = cfg.video?.width || 1920, h0 = cfg.video?.height || 1080;
  const conocido = FORMATOS.find(f => f.w === w0 && f.h === h0);
  const libre = el('div', { class: conocido ? 'hide' : '' , style: 'display:flex;gap:12px;align-items:flex-end;margin-top:12px;flex-wrap:wrap' });
  const inW = el('input', { class: 'input', type: 'number', style: 'width:120px', value: w0 });
  const inH = el('input', { class: 'input', type: 'number', style: 'width:120px', value: h0 });
  const nota = el('div', { class: 'muted', style: 'font-size:12px;margin-top:8px' });
  let ratio = w0 / h0, candado = true;

  const describe = () => {
    const w = Number(inW.value) || 0, h = Number(inH.value) || 0;
    const g = (a, b) => b ? g(b, a % b) : a;
    const d = g(w, h) || 1;
    nota.textContent = w && h ? `Proporción ${w / d}:${h / d}` : '';
  };
  const aplicar = (w, h) => {
    inW.value = w; inH.value = h;
    set(['video', 'width'], w); set(['video', 'height'], h);
    describe();
  };
  inW.addEventListener('input', () => {
    const w = Math.max(16, Math.round(Number(inW.value) || 0));
    aplicar(w, candado ? Math.round(w / ratio / 2) * 2 : Number(inH.value) || h0);
  });
  inH.addEventListener('input', () => {
    const h = Math.max(16, Math.round(Number(inH.value) || 0));
    aplicar(candado ? Math.round(h * ratio / 2) * 2 : Number(inW.value) || w0, h);
  });

  const sel = el('select', { class: 'input', style: 'width:auto', onchange: e => {
    if (e.target.value === 'libre') { libre.classList.remove('hide'); describe(); return; }
    libre.classList.add('hide');
    const f = FORMATOS[Number(e.target.value)];
    ratio = f.w / f.h;
    aplicar(f.w, f.h);
  } },
    FORMATOS.map((f, i) => el('option', { value: String(i), selected: conocido === f ? 'selected' : null }, f.t)),
    el('option', { value: 'libre', selected: conocido ? null : 'selected' }, 'Personalizado…'));

  libre.append(
    el('div', {}, el('label', { class: 'f' }, 'Ancho'), inW),
    el('div', {}, el('label', { class: 'f' }, 'Alto'), inH),
    el('label', { style: 'display:flex;gap:8px;align-items:center;font-size:13px;padding-bottom:10px' },
      el('input', { type: 'checkbox', checked: 'checked', onchange: e => { candado = e.target.checked; if (candado) ratio = (Number(inW.value) || 1) / (Number(inH.value) || 1); } }),
      'Mantener la proporción'));
  describe();

  return el('div', { style: 'margin-top:20px' },
    el('label', { class: 'f' }, 'Formato de salida'),
    sel, libre, nota);
}

// PROVEEDORES Y MODELOS, una tarjeta por categoría (inteligencia, voz,
// transcripción, imágenes, video, lipsync, música). El contenido sale del
// catálogo que sirve el programa, así que cada modelo nuevo aparece aquí solo
// —incluidas las rutas de ahorro de la v0.58.0: el modo híbrido, la calidad de
// GPT Image, Cartesia, AssemblyAI, Veo y ElevenLabs Music.
function proveedorCard(catKey, cat, cfg, set, keys) {
  const cur = (cfg.providers && cfg.providers[catKey]) || {};
  const detalle = el('div', { style: 'margin-top:14px;display:flex;flex-direction:column;gap:14px' });

  const pintarDetalle = (nombre) => {
    detalle.replaceChildren();
    const opt = (cat.options || []).find(o => o.name === nombre) || {};
    const items = opt.models || opt.voices || [];
    const campo = opt.voices ? 'voice' : 'model';
    if (items.length) {
      const libre = el('input', { class: 'input', value: cur[campo] || items[0].id,
        oninput: e => set(['providers', catKey, campo], e.target.value.trim()) });
      const sel = el('select', { class: 'input', onchange: e => {
        libre.value = e.target.value;
        set(['providers', catKey, campo], e.target.value);
      } }, items.map(m => el('option', { value: m.id, selected: m.id === (cur[campo] || items[0].id) ? 'selected' : null }, m.label)));
      detalle.append(
        el('div', {}, el('label', { class: 'f' }, opt.voices ? 'Voz' : 'Modelo'), sel),
        el('div', {}, el('label', { class: 'f' }, opt.voices ? 'O pega un voice_id de tu cuenta' : 'O escribe otro modelo'), libre));
    }
    for (const f of (cat.extra_fields || [])) {
      if (f.type === 'bool') {
        detalle.append(check(f.label, cur[f.key], v => set(['providers', catKey, f.key], v), f.hint));
        continue;
      }
      const esTexto = f.type === 'text';
      detalle.append(el('div', {},
        el('label', { class: 'f' }, f.label),
        el('input', { class: 'input', type: esTexto ? 'text' : 'number',
          value: cur[f.key] ?? (esTexto ? '' : 0),
          oninput: e => set(['providers', catKey, f.key], esTexto ? e.target.value : (Number(e.target.value) || 0)) }),
        f.hint ? el('div', { class: 'muted', style: 'font-size:12px;line-height:1.55;margin-top:5px;max-width:64ch' }, f.hint) : null));
    }
    if (opt.notes) detalle.append(el('div', { class: 'muted', style: 'font-size:12px;line-height:1.6;border-left:2px solid var(--divider);padding-left:12px;max-width:70ch' }, opt.notes));
  };

  const radios = (cat.options || []).map(o => {
    const falta = o.env && !keys[o.env];
    return el('label', { style: 'display:flex;gap:9px;align-items:baseline;cursor:pointer;padding:7px 0' },
      el('input', { type: 'radio', name: `prov-${catKey}`, value: o.name,
        checked: cur.name === o.name ? 'checked' : null,
        onchange: () => { set(['providers', catKey, 'name'], o.name); pintarDetalle(o.name); } }),
      el('span', {},
        el('span', { style: 'font-family:var(--heading);font-size:16px' }, o.label),
        o.env ? el('span', { class: falta ? 'tag tag-quiet' : 'tag', style: 'margin-left:9px' }, falta ? 'falta la clave' : 'lista') : null));
  });

  pintarDetalle(cur.name);
  return el('div', { class: 'card', style: 'padding:18px 20px' },
    el('h2', { style: 'font-size:21px' }, cat.title),
    el('div', { style: 'margin-top:10px' }, radios),
    detalle);
}

  const set = (path, value) => {
    let o = cfg;
    for (const k of path.slice(0, -1)) o = (o[k] = o[k] || {});

    let o = cfg; for (const k of path.slice(0, -1)) o = o?.[k] || {};

      // `audio.duck` es un SÍ/NO en la configuración; el rediseño lo pintaba

function pickFile(accept, cb) {
  const inp = el('input', { type: 'file', accept: accept || '', multiple: 'multiple', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const files = [];
    for (const f of inp.files) {
      const buf = await f.arrayBuffer();
      let bin = ''; const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      files.push({ name: f.name, data_base64: btoa(bin) });
    }
    cb(files);
  });
  document.body.append(inp); inp.click(); inp.remove();
}

    el('label', { style: 'display:flex;gap:7px;align-items:center;font-size:13px' },
      el('input', { type: 'checkbox', checked: d.broll_auto_replace ? 'checked' : null, onchange: ev => savePolicy({ auto_replace: ev.target.checked }) }), 'Reemplazar B-roll automáticamente'),
    el('label', { style: 'display:flex;gap:7px;align-items:center;font-size:13px' },
      el('input', { type: 'checkbox', checked: d.broll_review !== false ? 'checked' : null, onchange: ev => savePolicy({ review: ev.target.checked }) }), 'Revisar antes de montar'));

  async function savePolicy(body) {
    try { await api(`/api/projects/${S.slug}/broll-policy`, { method: 'PUT', body: JSON.stringify(body) }); await pollRun(); }
    catch (e) { alert(e.message); }
  }

  return el('div', { class: 'wrap' }, projHeader('escenas', `${scenes.length} escenas`),
    el('div', { style: 'display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:18px;flex-wrap:wrap' }, policy,
      el('div', { style: 'display:flex;gap:8px;align-items:center' }, msg,
        el('button', { class: 'btn btn-primary', onclick: async () => {
          if (!edits.size) { msg.textContent = 'Sin cambios.'; return; }
          try {
            const r = await api(`/api/projects/${S.slug}/scenes`, { method: 'PUT', body: JSON.stringify({ edits: [...edits.values()] }) });
            msg.textContent = r.rerun_from ? `Guardado. Se rehará desde «${r.rerun_from}».` : 'Sin cambios que afecten el montaje.';
            edits.clear(); await pollRun();
          } catch (e) { msg.textContent = e.message; }
        } }, 'Guardar cambios'))),
    el('table', { style: 'margin-top:16px' },
      el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, 'Escena'), el('th', {}, 'Animación'), el('th', {}, 'Transición'), el('th', {}, 'Sonido'), el('th', {}, 'Rótulo'), el('th', { style: 'text-align:right' }, 'Material propio'))),
      el('tbody', {}, rows)),
    el('div', { class: 'muted', style: 'font-size:13px;margin-top:12px' }, 'Estos ajustes se remontan sin volver a llamar a la IA. La narración y el orden se cambian en el guion.'));
}

function viewPersonajes() {
  const d = S.detail;
  if (!d) return el('div', { class: 'center' }, el('div', { class: 'kicker' }, 'Cargando…'));
  const chars = d.characters_roster || [];
  const nombre = el('input', { class: 'input', placeholder: 'Nombre del personaje' });
  const desc = el('input', { class: 'input', placeholder: 'Cómo se ve y cómo habla' });
  const narrador = el('input', { type: 'checkbox' });
  const pend = el('span', { class: 'muted', style: 'font-size:13px' });
  let files = [];

  const cards = chars.map(c => el('div', { class: 'card', style: 'padding:14px' },
    el('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline' },
      el('span', { style: 'font-family:var(--heading);font-size:19px' }, c.name),
      c.narrator ? el('span', { class: 'tag' }, 'narrador') : null),
    el('div', { class: 'muted', style: 'font-size:13px;line-height:1.6;margin-top:6px' }, c.description || 'sin descripción'),
    el('div', { class: 'mono muted', style: 'margin-top:8px' }, `${(c.files || []).length} imagen(es)`),
    el('div', { style: 'display:flex;gap:6px;margin-top:12px;flex-wrap:wrap' },
      c.narrator ? null : el('button', { class: 'btn btn-sm', onclick: async () => {
        try { await api(`/api/projects/${S.slug}/characters/${c.id}`, { method: 'PUT', body: JSON.stringify({ narrator: true }) }); await pollRun(); render(); } catch (e) { alert(e.message); }
      } }, 'Hacer narrador'),
      el('button', { class: 'btn btn-sm', onclick: () => pickFile('image/*', async fs => {
        try { await api(`/api/projects/${S.slug}/characters/${c.id}/files`, { method: 'POST', body: JSON.stringify({ files: fs }) }); await pollRun(); render(); } catch (e) { alert(e.message); }
      }) }, 'Añadir imágenes'),
      el('button', { class: 'btn btn-sm btn-ghost', onclick: async () => {
        if (!confirm(`¿Borrar a ${c.name}?`)) return;
        try { await api(`/api/projects/${S.slug}/characters/${c.id}`, { method: 'DELETE' }); await pollRun(); render(); } catch (e) { alert(e.message); }
      } }, 'Borrar'))));

  return el('div', { class: 'wrap', style: 'max-width:980px' }, projHeader('personajes', `${chars.length} personajes${d.has_character ? ' · con narrador' : ''}`),
    chars.length ? el('div', { class: 'grid4', style: 'margin-top:20px' }, cards)
      : el('p', { class: 'muted', style: 'margin-top:20px;max-width:540px;line-height:1.75' }, 'Sin personajes. Si añades uno con foto y lo marcas como narrador, el sistema le hace lipsync en parte del video en lugar de mostrar solo B-roll.'),
    el('div', { style: 'border-top:1px solid var(--divider);margin-top:26px;padding-top:20px;max-width:560px' },
      el('div', { class: 'kicker' }, 'Añadir personaje'),
      el('div', { style: 'display:flex;flex-direction:column;gap:12px;margin-top:12px' }, nombre, desc,
        el('label', { style: 'display:flex;gap:8px;align-items:center;font-size:13px' }, narrador, 'Es el narrador del video'),
        el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
          el('button', { class: 'btn btn-sm', onclick: () => pickFile('image/*', fs => { files = fs; pend.textContent = `${fs.length} imagen(es) listas`; }) }, 'Elegir imágenes'), pend),
        el('button', { class: 'btn btn-primary', style: 'align-self:flex-start', onclick: async () => {
          try {
            await api(`/api/projects/${S.slug}/characters`, { method: 'POST', body: JSON.stringify({ name: nombre.value, description: desc.value, narrator: narrador.checked, files }) });
            files = []; await pollRun(); render();
          } catch (e) { alert(e.message); }
        } }, 'Guardar personaje'))),
    el('div', { class: 'muted', style: 'font-size:13px;margin-top:14px' }, 'Tras cambiar el elenco, rehaz desde «Escenas» para que el director lo use.'));
}

// MATERIAL del proyecto: tu narración grabada, tu guion, tu B-roll propio,
// enlaces de referencia y las fotos del personaje. Es por donde EMPIEZA el
// trabajo de quien narra sus propios videos, y en el rediseño no existía:
// no había forma de subir la voz.
const CATS_MATERIAL = [
  ['voz', 'Narración (tu voz)', 'audio/*', 'La grabación que manda: las escenas se cortan a su medida y los subtítulos se sincronizan a tu palabra exacta.'],
  ['guion', 'Guion o notas', '.txt,.md,.pdf,.docx,.doc,.rtf', 'Si ya tienes guion, súbelo: no se reinventa. También sirven notas sueltas.'],
  ['broll', 'B-roll propio', 'image/*,video/*', 'Nómbralos scene_003.jpg o 03_batalla.mp4 y van a ESA escena. Tu material siempre gana sobre lo generado.'],
  ['personaje', 'Fotos del personaje', 'image/*', 'Para que el personaje narre en cámara con lipsync, y para mantener su cara igual en todas sus escenas.'],
  ['reaccion', 'Video de reacción', 'video/*', 'Se compone sobre el contenido (croma o burbuja).'],
];

function viewMaterial() {
  const d = S.detail;
  if (!d) return el('div', { class: 'center' }, el('div', { class: 'kicker' }, 'Cargando…'));
  const assets = d.assets || [];
  const msg = el('span', { class: 'muted', style: 'font-size:13px' });

  const subir = (categoria) => pickFile(
    CATS_MATERIAL.find(c => c[0] === categoria)?.[2] || '',
    async files => {
      if (!files.length) return;
      msg.textContent = 'Subiendo…';
      try {
        await api(`/api/projects/${S.slug}/assets`, { method: 'POST',
          body: JSON.stringify({ files: files.map(f => ({ ...f, category: categoria })) }) });
        await pollRun(); render();
      } catch (e) { msg.textContent = e.message; }
    });

  const enlace = el('input', { class: 'input', placeholder: 'https://www.youtube.com/watch?v=…' });
  const addEnlace = async () => {
    const url = enlace.value.trim();
    if (!url) return;
    msg.textContent = 'Registrando el enlace…';
    try {
      await api(`/api/projects/${S.slug}/assets`, { method: 'POST',
        body: JSON.stringify({ files: [{ name: 'referencia.txt', category: 'referencia',
          data_base64: btoa(unescape(encodeURIComponent(url))) }] }) });
      enlace.value = ''; await pollRun(); render();
    } catch (e) { msg.textContent = e.message; }
  };

  return el('div', { class: 'wrap' },
    projHeader('material', 'Material'),
    el('p', { class: 'muted', style: 'font-size:13px;line-height:1.7;max-width:70ch;margin-top:16px' },
      'Todo lo que aportas tú. Al añadir o quitar material, el análisis vuelve a empezar desde la primera fase — es lo correcto, porque cambia la base del video.'),
    el('div', { style: 'display:flex;flex-direction:column;gap:22px;margin-top:24px' },
      CATS_MATERIAL.map(([cat, titulo, , ayuda]) => {
        const mios = assets.filter(a => a.category === cat);
        return el('div', {},
          el('div', { style: 'display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--divider);padding-bottom:7px' },
            el('h3', { style: 'font-size:19px' }, titulo),
            el('span', { class: 'mono muted' }, String(mios.length)),
            el('span', { style: 'flex:1' }),
            el('button', { class: 'btn btn-sm', onclick: () => subir(cat) }, 'Añadir')),
          el('div', { class: 'muted', style: 'font-size:12.5px;line-height:1.6;margin-top:8px;max-width:70ch' }, ayuda),
          mios.length ? el('div', { style: 'margin-top:10px' }, mios.map(a =>
            el('div', { style: 'display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--divider)' },
              el('span', { class: 'mono', style: 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, a.file || a.name || `#${a.id}`),
              el('button', { class: 'btn btn-sm btn-ghost', title: 'Quitar', onclick: async () => {
                if (!confirm(`¿Quitar «${a.file || a.id}» del proyecto?`)) return;
                try { await api(`/api/projects/${S.slug}/assets/${a.id}`, { method: 'DELETE' }); await pollRun(); render(); }
                catch (e) { msg.textContent = e.message; }
              } }, '×')))) : null);
      }),
      el('div', {},
        el('div', { style: 'border-bottom:1px solid var(--divider);padding-bottom:7px' },
          el('h3', { style: 'font-size:19px' }, 'Enlace de referencia (YouTube)')),
        el('div', { class: 'muted', style: 'font-size:12.5px;line-height:1.6;margin:8px 0 10px;max-width:70ch' },
          'El programa aprende el ritmo de los cortes, el estilo visual y la fórmula narrativa del video que le pases. Uno bueno vale más que tres regulares.'),
        el('div', { style: 'display:flex;gap:8px' }, enlace,
          el('button', { class: 'btn', onclick: addEnlace }, 'Añadir enlace')),
        assets.filter(a => a.category === 'referencia').map(a =>
          el('div', { class: 'mono muted', style: 'padding:6px 0' }, a.file || a.url || `#${a.id}`))),
      msg));
}

function viewMetadatos() {
  const d = S.detail;
  if (!d) return el('div', { class: 'center' }, el('div', { class: 'kicker' }, 'Cargando…'));
  const meta = d.metadata_full;
  if (!meta) return el('div', { class: 'wrap' }, projHeader('metadatos', 'Metadatos'),
    el('p', { class: 'muted', style: 'margin-top:22px;max-width:520px;line-height:1.75' }, 'Aún no hay metadatos. Genera hasta la fase de metadatos para elegir entre las tres propuestas de título, descripción y miniatura.'));
  const chosen = meta.chosen || {};
  const pick = async (kind, index) => {
    try { await api(`/api/projects/${S.slug}/metadata/select`, { method: 'POST', body: JSON.stringify({ kind, index }) }); await pollRun(); render(); }
    catch (e) { alert(e.message); }
  };
  const opciones = (kind, items, renderItem) => el('div', { style: 'margin-top:22px' },
    el('div', { class: 'kicker', style: 'margin-bottom:10px' }, { title: 'Título', description: 'Descripción', thumbnail: 'Miniatura' }[kind]),
    el('div', { style: kind === 'thumbnail' ? 'display:grid;grid-template-columns:repeat(3,1fr);gap:16px' : 'display:flex;flex-direction:column;gap:10px' },
      items.map((it, i) => el('div', {
        class: 'card',
        style: `padding:${kind === 'thumbnail' ? '8px' : '13px 15px'};cursor:pointer;${chosen[kind] === i ? 'border-color:var(--accent);background:var(--a100)' : ''}`,
        onclick: () => pick(kind, i)
      }, renderItem(it, i), chosen[kind] === i ? el('div', { class: 'mono', style: 'color:var(--a700);margin-top:8px' }, 'elegida') : null))));

  return el('div', { class: 'wrap', style: 'max-width:880px' }, projHeader('metadatos', 'Elige lo que se publica'),
    (meta.title_options || []).length ? opciones('title', meta.title_options, o => el('div', { style: 'font-family:var(--heading);font-size:20px;line-height:1.3' }, o.title || o)) : null,
    (meta.description_options || []).length ? opciones('description', meta.description_options, o => el('div', { style: 'font-size:14px;line-height:1.7' }, (o.description || o).slice(0, 320))) : null,
    (meta.thumbnails || []).length ? opciones('thumbnail', meta.thumbnails, f => el('img', { src: `/files/${S.slug}/final/${f}`, style: 'width:100%;display:block' })) : null,
    el('div', { class: 'muted', style: 'font-size:13px;margin-top:18px' }, 'Elegir no vuelve a generar nada: solo cambia qué opción se usa al publicar.'));
}

boot();
</script>
</body>
</html>
