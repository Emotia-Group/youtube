<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytstudio — creador de videos</title>
<style>
  :root{
    --bg:#0c0e13; --panel:#141821; --panel2:#1a1f2b; --line:#262d3d;
    --text:#e8eaf0; --muted:#8b93a7; --accent:#f0b429; --accent2:#e8590c;
    --ok:#37b24d; --err:#f03e3e; --run:#4dabf7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px}
  input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
  input:focus,textarea:focus,select:focus{outline:1px solid var(--accent)}
  ::placeholder{color:#5a6178}
  h1{font-size:19px} h2{font-size:16px;margin-bottom:10px} h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
  .btn{background:var(--accent);color:#141414;font-weight:600;padding:10px 18px}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* sidebar */
  #sidebar{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
  #logo{display:flex;align-items:center;gap:9px;margin-bottom:20px;padding:0 4px}
  #logo .clap{font-size:24px}
  #logo small{display:block;color:var(--muted);font-size:11px}
  .navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;color:var(--text);padding:9px 10px;border-radius:8px;margin-bottom:4px}
  .navbtn:hover{background:var(--panel2)}
  .navbtn.active{background:var(--panel2);color:var(--accent)}
  #projlist{flex:1;overflow-y:auto;margin-top:6px}
  #verinfo{font-size:11px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line);margin-top:8px}
  #verinfo b{color:var(--ok)}
  #verinfo.stale b{color:var(--err)}
  .proj{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}
  .proj:hover{background:var(--panel2)}
  .proj:hover .projactions{opacity:1}
  .proj.active{background:var(--panel2);outline:1px solid var(--line)}
  .proj .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .proj .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .proj .bar i{display:block;height:100%;background:var(--accent)}
  .proj.running .bar i{background:var(--run)}
  .proj.haserror .name{color:var(--err)}
  .projactions{display:flex;gap:2px;opacity:0;flex-shrink:0}
  .projactions button{background:none;color:var(--muted);padding:2px 5px;font-size:12px;border-radius:5px}
  .projactions button:hover{background:var(--panel);color:var(--text)}
  #projtools{margin:2px 0 8px}
  #projtools input,#projtools select{padding:6px 9px;font-size:12.5px;margin-bottom:5px}

  /* main */
  #main{flex:1;overflow-y:auto;padding:26px 34px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .muted{color:var(--muted);font-size:13px}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}

  .hidden{display:none !important}

  /* progreso en vivo */
  #progressbar{margin:8px 0 14px}
  #progressbar .track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  #progressbar .track i{display:block;height:100%;background:var(--run);transition:width .4s ease}
  #progressbar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

  /* fases */
  #phases{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .phase{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .phase.done{border-color:var(--ok);color:var(--ok)}
  .phase.failed{border-color:var(--err);color:var(--err)}
  .phase.running{border-color:var(--run);color:var(--run);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .banner{border:1px solid var(--accent);background:rgba(240,180,41,.08);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:13.5px}
  .banner b{color:var(--accent)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
  .step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
  .step b{display:block;color:var(--accent);margin-bottom:4px}
  .radio-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .radio-row label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px}
  .radio-row input{width:auto}
  .upcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:10px 0}
  .upcat{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px}
  .upcat b{display:block;margin-bottom:2px}
  .upcat .hint{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}
  .upcat input[type=file]{font-size:12.5px;padding:6px}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;margin-top:6px;font-size:12.5px}
  .filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip button{background:none;color:var(--err);font-size:15px;padding:0 2px}
  .keyfield{display:grid;grid-template-columns:220px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}

  /* log */
  #log{background:#080a0e;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.7 ui-monospace,monospace;max-height:230px;overflow-y:auto;white-space:pre-wrap;display:none}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{background:none;color:var(--muted);padding:9px 16px;border-radius:8px 8px 0 0;font-weight:600}
  .tab.active{color:var(--accent);background:var(--panel)}

  /* storyboard */
  .scene{display:flex;gap:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .scene img{width:240px;height:135px;object-fit:cover;border-radius:8px;background:#000}
  .scene .num{color:var(--accent);font-weight:700;font-size:13px}
  .scene audio{width:100%;height:32px;margin-top:8px}
  .badge{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:11.5px;color:var(--muted);margin-left:6px}

  /* settings */
  .provcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .keydot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .keydot.on{background:var(--ok)} .keydot.off{background:var(--err)}
  .preset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel2)}
  .preset.sel{border-color:var(--accent);outline:1px solid var(--accent)}
  .preset b{display:block;margin-bottom:3px}
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

  /* selector de plataforma (tarjetas) y previews con aspecto real */
  .fmtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 10px}
  .fmtcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 10px;cursor:pointer;text-align:center;transition:border-color .15s}
  .fmtcard:hover{border-color:var(--accent)}
  .fmtcard.active{border-color:var(--accent);outline:1px solid var(--accent)}
  .fmtcard .ic{font-size:26px;display:block;margin-bottom:4px}
  .fmtcard .nm{font-size:12.5px;font-weight:600;display:block}
  .fmtcard .as{font-size:11px;color:var(--muted)}
  .phase.mini{padding:3px 8px;font-size:11px;opacity:.55}
  .vframe{display:block;margin:0 auto;background:#000;border-radius:16px;border:1px solid var(--line)}
  #toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:10px;display:none;z-index:50}
  video{width:100%;max-height:520px;border-radius:10px;background:#000}
  textarea#scripted{min-height:420px;font:14px/1.7 ui-monospace,monospace}
  a{color:var(--accent)}
</style>
</head>
<body>

<div id="sidebar">
  <div id="logo"><span class="clap">🎬</span><div><b>ytstudio</b><small>videos largos con IA</small></div></div>
  <button class="navbtn" onclick="showNew()">＋ Nuevo proyecto</button>
  <button class="navbtn" onclick="showLibrary()">📺 Canales y estilos</button>
  <button class="navbtn" onclick="showManual()">📖 Manual de uso</button>
  <button class="navbtn" onclick="showEvents()">🧾 Log de eventos</button>
  <button class="navbtn" onclick="showSettings()">⚙ Configuración</button>
  <h3 style="padding:0 6px">Proyectos</h3>
  <div id="projtools">
    <input id="projsearch" placeholder="🔎 Buscar…" oninput="PROJQ=this.value;renderProjList()">
    <select id="projfilter" onchange="PROJFILTER=this.value;renderProjList()">
      <option value="all">Todos</option>
      <option value="running">⏳ En curso</option>
      <option value="done">✔ Completos</option>
      <option value="error">⚠ Con errores</option>
    </select>
  </div>
  <div id="projlist"></div>
  <div id="verinfo"></div>
</div>

<div id="main"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>(t??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CAT=null, CFG=null, current=null, pollTimer=null, view='home';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||r.statusText);
  return data;
}
function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',ms)}

/* ---------- sidebar ---------- */
let PROJQ='', PROJFILTER='all';
const fmtDate=ts=>{
  if(!ts)return'';
  const d=new Date(ts*1000),now=new Date();
  return d.toDateString()===now.toDateString()
    ?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
    :d.toLocaleDateString([],{day:'2-digit',month:'short'});
};
async function refreshList(){
  window._allProjects=await api('/api/projects');
  renderProjList();
}
function renderProjList(){
  let projects=window._allProjects||[];
  const q=PROJQ.trim().toLowerCase();
  if(q)projects=projects.filter(p=>(p.display_name||p.slug).toLowerCase().includes(q));
  if(PROJFILTER==='running')projects=projects.filter(p=>p.running);
  else if(PROJFILTER==='done')projects=projects.filter(p=>p.done===p.total&&p.total>0);
  else if(PROJFILTER==='error')projects=projects.filter(p=>p.has_error);
  $('#projlist').innerHTML=projects.map(p=>`
    <div class="proj ${p.slug===current?'active':''} ${p.running?'running':''} ${p.has_error?'haserror':''}" onclick="openProject('${p.slug}')">
      <div style="display:flex;align-items:center;gap:4px">
        <div class="name">${p.running?'⏳ ':p.has_error?'⚠ ':''}${esc(p.display_name||p.slug)}</div>
        <div class="projactions" onclick="event.stopPropagation()">
          <button title="Duplicar" onclick="duplicateProject('${p.slug}')">⧉</button>
          <button title="Renombrar" onclick="renameProject('${p.slug}')">✎</button>
          <button title="Borrar" onclick="deleteProjectFromList('${p.slug}')">🗑</button>
        </div>
      </div>
      <div class="muted">${p.done}/${p.total} fases${p.created_at?' · '+fmtDate(p.created_at):''}</div>
      <div class="bar"><i style="width:${100*p.done/p.total}%"></i></div>
    </div>`).join('')||`<div class="muted" style="padding:8px">${q||PROJFILTER!=='all'?'Sin resultados':'Sin proyectos aún'}</div>`;
}
async function duplicateProject(slug){
  const proj=(window._allProjects||[]).find(x=>x.slug===slug);
  const suggested=`${proj?(proj.display_name||slug):slug} (copia)`;
  const name=prompt('Nombre para la copia:',suggested);
  if(name===null)return;  // cancelado
  const trimmed=name.trim();
  if(!trimmed){toast('Ponle un nombre a la copia');return}
  try{
    const r=await api(`/api/projects/${slug}/duplicate`,{method:'POST',body:JSON.stringify({name:trimmed})});
    toast('✅ Proyecto duplicado');
    await refreshList();
    openProject(r.slug);
  }catch(e){toast('⚠ '+e.message)}
}
async function renameProject(slug){
  const proj=(window._allProjects||[]).find(x=>x.slug===slug);
  const cur=proj?(proj.display_name||slug):slug;
  const name=prompt('Nuevo nombre para el proyecto:',cur);
  if(name===null)return;
  const trimmed=name.trim();
  if(!trimmed)return;
  try{
    await api(`/api/projects/${slug}/rename`,{method:'PUT',body:JSON.stringify({name:trimmed})});
    toast('✅ Renombrado');
    await refreshList();
    if(slug===current)await renderProject();  // el panel principal mostraba el nombre viejo
  }catch(e){toast('⚠ '+e.message)}
}
async function deleteProjectFromList(slug){
  const proj=(window._allProjects||[]).find(x=>x.slug===slug);
  if(proj&&proj.running){toast('⚠ No se puede borrar mientras se está generando.');return}
  const name=proj?(proj.display_name||slug):slug;
  if(!confirm(`¿Borrar el proyecto «${name}» y todos sus archivos generados? Esta acción no se puede deshacer.`))return;
  try{
    await api(`/api/projects/${slug}`,{method:'DELETE'});
    toast('🗑 Proyecto borrado');
    if(current===slug){current=null;showNew()}
    refreshList();
  }catch(e){toast('⚠ '+e.message)}
}

/* ---------- nuevo proyecto ---------- */
async function showNew(){
  view='new';current=null;stopPoll();refreshList();
  window._lib=await api('/api/library').catch(()=>({channels:[],styles:[]}));
  const presets=Object.entries(CAT.style_presets).map(([k,p])=>`
    <div class="preset ${k===(CFG.style?.preset||'ninguno')?'sel':''}" data-k="${k}"
         onclick="document.querySelectorAll('.preset').forEach(e=>e.classList.remove('sel'));this.classList.add('sel')">
      <b>${esc(p.label)}</b><span class="muted">${esc(p.description)}</span>
    </div>`).join('');
  const mock=!CAT.keys.ANTHROPIC_API_KEY;
  $('#main').innerHTML=`
  <h1>Nuevo proyecto</h1>
  <p class="muted">Dale una idea o pega tu guion, y el sistema produce un video largo listo para YouTube: concepto, guion, escenas, voz, imágenes, música, subtítulos y montaje.</p>
  <div class="steps">
    <div class="step"><b>1 · Tú aportas</b>una idea, un guion, una nota de voz, una imagen o un video de referencia.</div>
    <div class="step"><b>2 · La IA produce</b>concepto y estilo, guion, guion gráfico por escenas, voz en off, imágenes y música.</div>
    <div class="step"><b>3 · Se monta</b>todo se une con animación, subtítulos y música: obtienes el video, la miniatura y los metadatos.</div>
  </div>
  ${mock?`<div class="banner">⚠ <b>Modo vista previa activo</b> — sin clave de API, el resultado usa contenido de marcador (para ver cómo funciona). Configura tu clave en ⚙ Configuración para calidad real.</div>`:''}
  <div class="card">
    <label class="f"><span>1 · Nombre del proyecto</span>
      <input id="np-slug" placeholder="ej. la-historia-de-los-faros"></label>
    <label class="f"><span>1 · ¿Para dónde es este video?</span></label>
    <div class="fmtgrid">
      ${Object.entries(CAT.formats||{}).map(([k,f])=>{
        const parts=f.label.split(' — ');
        const ic=f.label.trim().split(' ')[0];
        const nm=parts[0].replace(ic,'').trim();
        return `<div class="fmtcard ${k==='long'?'active':''}" data-fmt="${k}" onclick="pickFormat('${k}')">
          <span class="ic">${ic}</span><span class="nm">${esc(nm)}</span>
          <span class="as">${esc(parts[1]||'')}</span></div>`;
      }).join('')}
    </div>
    <select id="np-format" style="display:none">
      ${Object.entries(CAT.formats||{}).map(([k,f])=>`<option value="${k}">${esc(f.label)}</option>`).join('')}
    </select>
    <p class="muted" style="font-size:12px;margin:2px 0 8px">Los formatos cortos (Short/Reel/TikTok/Ads) generan con guion de gancho, escenas rápidas, texto grande de apertura, rupturas de patrón y subtítulos quemados — listos para subir.</p>
    <div id="np-tpl-wrap" style="display:none">
      <label class="f"><span>🎬 Plantilla del corto (estructura + visuales + sonido en un clic)</span>
        <select id="np-template" style="width:auto">
          ${Object.entries(CAT.short_templates||{}).map(([k,t])=>`<option value="${k}" title="${esc(t.hint||'')}">${esc(t.label)}</option>`).join('')}
        </select></label>
      <p class="muted" id="np-tpl-hint" style="font-size:12px;margin:2px 0 8px"></p>
    </div>
    <label class="f"><span>🧑 Presencia del personaje en pantalla (solo si subes su imagen en «Personaje narrador»)</span>
      <select id="np-charpres" style="width:auto">
        <option value="15">~15% — apariciones puntuales</option>
        <option value="30" selected>~30% — gancho, momentos clave y cierre (recomendado)</option>
        <option value="45">~45% — muy presente</option>
        <option value="60">~60% — el video es sobre todo el personaje</option>
      </select></label>
    <p class="muted" style="font-size:12px;margin:2px 0 8px">⚠ El lipsync se cobra por segundo de personaje en pantalla: más presencia = más costo (la estimación previa lo refleja). El director decide en QUÉ momentos aparece con criterio narrativo; luego puedes forzarlo escena a escena en el Editor.</p>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="np-charpip" style="width:auto">
      <span>🫧 Personaje en BURBUJA: en vez de ocupar la pantalla, el personaje aparece en una burbuja circular sobre el B-roll (estilo reacción de TikTok)</span></label>
    <label class="f"><span>2 · Escribe tu idea o pega tu guion completo (opcional si subes archivos)</span>
      <textarea id="np-text" rows="6" placeholder="Ejemplo de idea: «Un documental sobre los fareros que salvaron miles de vidas en el siglo XIX».&#10;&#10;O pega aquí tu guion completo y se respetará tal cual."></textarea></label>
    <h3>3 · Archivos (opcional) — puedes subir varios y quitarlos con ✕</h3>
    ${uploadCatsHtml()}
    <label class="f"><span>4 · Enlaces de referencia (opcional) — videos de YouTube, Vimeo, Wistia… cuyo estilo quieres replicar (uno por línea). Se analiza el video completo: guion, ritmo de cortes, estructura y estilo visual</span>
      <textarea id="np-links" rows="2" placeholder="https://www.youtube.com/watch?v=…&#10;https://vimeo.com/…"></textarea></label>
    <h3>5 · Canal y estilo guardado (opcional) — reutiliza un estilo de tu biblioteca sin re-analizar nada</h3>
    <div class="row">
      <select id="np-channel" style="width:auto" onchange="fillStyleOptions()">
        <option value="">Sin canal</option>
        ${(window._lib.channels||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
      </select>
      <select id="np-style" style="width:auto"></select>
      <span class="muted" style="font-size:12px">Gestiónalos en «📺 Canales y estilos»</span>
    </div>
    <h3>6 · Estilo del video (se ignora si elegiste un estilo guardado)</h3>
    <div class="presets">${presets}</div>
    <br><button class="btn" onclick="createProject()">Crear proyecto →</button>
  </div>`;
  window._pending=[];
  fillStyleOptions();
}
function fillStyleOptions(){
  const sel=$('#np-style');if(!sel)return;
  const ch=$('#np-channel')?.value||'';
  const styles=(window._lib?.styles||[]).filter(s=>!ch||s.channel_id===ch);
  sel.innerHTML=`<option value="">Sin estilo guardado (se crea uno nuevo)</option>`
    +styles.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  // si el canal tiene un único estilo, preseleccionarlo
  if(ch&&styles.length===1)sel.value=styles[0].id;
}

const UPLOAD_CATS=[
  ['guion','📄 Guion o idea','Documentos con tu guion: PDF, Word (.docx), PowerPoint, Excel, .txt, .md','.txt,.md,.pdf,.docx,.doc,.pptx,.xlsx,.xls'],
  ['voz','🎙 Tu voz / narración','Si subes tu narración grabada, se usa TAL CUAL en el video: se recortan los silencios largos y cada escena se alinea a lo que dices (mp3, wav, m4a…)','audio/*'],
  ['broll','🎬 Tu B-roll (imágenes y videos)','Tus propias imágenes/videos: se usan directamente en el montaje del video','image/*,video/*'],

function uploadCatsHtml(){
  return `<div class="upcats">${UPLOAD_CATS.map(([k,label,hint,accept])=>`
    <div class="upcat"><b>${label}</b><span class="hint">${hint}</span>
      <input type="file" multiple accept="${accept}" onchange="addPending('${k}',this)">
      <div id="chips-${k}"></div>
    </div>`).join('')}</div>`;

function addPending(cat,input){
  window._pending=window._pending||[];
  for(const f of input.files){
    if(f.size>300*1024*1024){toast(`«${f.name}» supera 300 MB — omitido`);continue}
    window._pending.push({file:f,category:cat});
  }
  input.value='';
  renderChips();
}
function removePending(i){window._pending.splice(i,1);renderChips()}
function renderChips(){
  UPLOAD_CATS.forEach(([k])=>{const el=$('#chips-'+k);if(el)el.innerHTML=''});
  (window._pending||[]).forEach((p,i)=>{
    const el=$('#chips-'+p.category);
    if(el)el.insertAdjacentHTML('beforeend',
      `<div class="filechip"><span title="${esc(p.file.name)}">${esc(p.file.name)}</span>
       <em class="muted" style="font-size:11px">${(p.file.size/1048576).toFixed(1)} MB</em>
       <button title="Quitar" onclick="removePending(${i})">✕</button></div>`);
  });
}
function readB64(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(f)})}
async function createProject(){
  const slug=$('#np-slug').value.trim(), text=$('#np-text').value.trim();
  const links=($('#np-links')?.value||'').split(/\s+/).map(s=>s.trim()).filter(s=>/^https?:\/\//.test(s));
  const pending=window._pending||[];
  if(!slug){toast('Ponle un nombre al proyecto');return}
  if(!text&&!pending.length&&!links.length){toast('Escribe una idea/guion, sube un archivo o añade un enlace');return}
  const btn=document.querySelector('button.btn[onclick="createProject()"]');
  if(btn){btn.disabled=true;btn.textContent='Subiendo…'}
  try{
    const files=[];
    for(const p of pending){
      files.push({name:p.file.name,data_base64:await readB64(p.file),category:p.category});
    }
    const r=await api('/api/projects',{method:'POST',body:JSON.stringify(
      {slug,text,files,links,style_preset:document.querySelector('.preset.sel')?.dataset.k,
       format:$('#np-format')?.value||'long',short_template:$('#np-template')?.value||'libre',
       character_presence:parseInt($('#np-charpres')?.value||'30'),character_pip:!!$('#np-charpip')?.checked,
       channel_id:$('#np-channel')?.value||null,style_id:$('#np-style')?.value||null})});
    toast(`Proyecto creado con ${r.assets.length} archivo(s)`);
    openProject(r.slug);
  }catch(e){toast('⚠ '+e.message);if(btn){btn.disabled=false;btn.textContent='Crear proyecto →'}}
}

function aspectOf(p){

async function uploadSceneBroll(sid,input){
  const f=input.files[0];if(!f)return;

  toast('Subiendo…',1500);
  try{
    const data_base64=await readB64(f);
    const r=await api(`/api/projects/${current}/scenes/${sid}/broll`,{method:'POST',
      body:JSON.stringify({file:{name:f.name,data_base64}})});
    toast(r.downgrade?'✅ Imagen subida (la escena era de video → se usa como imagen con movimiento)':'✅ B-roll subido a la escena '+sid);
    await renderProject('Storyboard');
  }catch(e){toast('⚠ '+e.message)}
  input.value='';
}

/* ---------- polling ---------- */
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function startPoll(){
  stopPoll();
  let lastCount=-1,wasRunning=false,lastPhase=null,toastedCount=-1;
  pollTimer=setInterval(async()=>{
    if(view!=='project'||!current){stopPoll();return}
    const log=await api(`/api/projects/${current}/log`);
    const el=$('#log');
    if(el&&(log.running||log.lines.length)){
      el.style.display='block';
      if(log.lines.length!==lastCount){el.textContent=log.lines.join('\n');el.scrollTop=el.scrollHeight;lastCount=log.lines.length;}
      if(log.running&&log.phase!==lastPhase){lastPhase=log.phase;renderPhasesOnly(log.phase);}
    }
    // aviso claro de que el programa SIGUE trabajando: un toast por cada
    // fase que termina, no solo el resultado final del video completo. La
    // primera lectura solo fija la base (no reproduce fases ya viejas si
    // se recarga la página a mitad de una corrida).
    if(toastedCount<0){toastedCount=log.lines.length}
    else if(log.lines.length>toastedCount){
      for(const line of log.lines.slice(toastedCount)){
        const m=/^✔\s+(\w+)\s+completada en ([\d.]+)s/.exec(line);
        if(m)toast(`✔ ${phaseLabel(m[1])} completada (${m[2]}s)`,2200);
      }
      toastedCount=log.lines.length;
    }
    const pb=$('#progressbar');
    if(pb){
      if(log.running){
        pb.classList.remove('hidden');
        const pct=log.percent??0;
        pb.querySelector('.track i').style.width=pct+'%';
        pb.querySelector('#progresspct').textContent=pct+'% completo';
        pb.querySelector('#progresseta').textContent=log.eta_seconds!=null
          ?`~${log.eta_seconds<60?Math.round(log.eta_seconds)+'s':Math.round(log.eta_seconds/60)+' min'} restantes`:'';
      }else{pb.classList.add('hidden')}
    }
    if(wasRunning&&!log.running){
      if(!log.error){
        const d=await api('/api/projects/'+current);
        if(d.final_video)window._tab='Video';  // mostrar el resultado directamente
      }
      await renderProject();refreshList();
      toast(log.error?'⚠ '+log.error:'✅ ¡Video generado!');
    }
    wasRunning=log.running;
  },1500);
}

function renderModelPick(catKey){
  const cat=CAT.catalog[catKey];
  const sel=document.querySelector(`input[name=prov-${catKey}]:checked`)?.value;
  const opt=cat.options.find(o=>o.name===sel)||{};
  const cur=CFG.providers[catKey]||{};
  let html='';
  const items=opt.models||opt.voices||[];
  if(items.length){
    const field=opt.voices?'voice':'model';
    const curVal=cur[field]||items[0].id;
    html+=`<label class="f"><span>${opt.voices?'Voz':'Modelo'}</span>
      <select id="pick-${catKey}" onchange="$('#free-${catKey}').value=this.value">
        ${items.map(m=>`<option value="${m.id}" ${m.id===curVal?'selected':''}>${esc(m.label)}</option>`).join('')}

      <label class="f"><span>o escribe un ${opt.voices?'voice_id':'modelo'} personalizado</span>
      <input id="free-${catKey}" value="${esc(curVal)}"></label>`;
  }
  (cat.extra_fields||[]).forEach(f=>{
    const isTxt=f.type==='text';
    html+=`<label class="f"><span>${esc(f.label)}</span>
      <input type="${isTxt?'text':'number'}" id="extra-${catKey}-${f.key}" value="${esc(String(cur[f.key]??(isTxt?'':0)))}">

  });

async function saveKeys(){
  const keys={};
  for(const k of ['ANTHROPIC_API_KEY','OPENAI_API_KEY','ELEVENLABS_API_KEY','REPLICATE_API_TOKEN']){
    const v=$('#key-'+k)?.value.trim();
    if(v)keys[k]=v;
  }
  if(!Object.keys(keys).length){toast('Pega al menos una clave');return}
  try{
    const r=await api('/api/keys',{method:'PUT',body:JSON.stringify({keys})});
    CAT.keys=r.keys;
    toast('✅ Claves guardadas y activas');
    showSettings();
  }catch(e){toast('⚠ '+e.message)}
}
async function saveSettings(){
  const cfg=JSON.parse(JSON.stringify(CFG));
  cfg.style={preset:document.querySelector('#stylegrid .preset.sel')?.dataset.k||'ninguno'};
  cfg.video.target_minutes=+$('#v-min').value||10;
  const [w,h]=$('#v-res').value.split('x').map(Number);
  cfg.video.width=w;cfg.video.height=h;
  cfg.video.burn_subtitles=$('#v-subs').value==='true';
  cfg.video.scene_seconds=+$('#v-ritmo').value||6;
  cfg.language=$('#v-lang').value||'es';
  cfg.audio.music_db=+$('#a-db').value; cfg.audio.duck=$('#a-duck').value==='true';
  cfg.audio.element_sfx=$('#a-insfx')?.value||'auto';
  for(const catKey of Object.keys(CAT.catalog)){
    const sel=document.querySelector(`input[name=prov-${catKey}]:checked`)?.value;
    if(!sel)continue;
    cfg.providers[catKey]=cfg.providers[catKey]||{};
    cfg.providers[catKey].name=sel;
    const opt=CAT.catalog[catKey].options.find(o=>o.name===sel)||{};
    const free=$(`#free-${catKey}`);
    if(free&&free.value){cfg.providers[catKey][opt.voices?'voice':'model']=free.value}
    (CAT.catalog[catKey].extra_fields||[]).forEach(f=>{
      const el=$(`#extra-${catKey}-${f.key}`);if(!el)return;
      cfg.providers[catKey][f.key]=f.type==='text'?el.value:(+el.value||0);
    });
  }
  try{await api('/api/config',{method:'PUT',body:JSON.stringify({config:cfg})});
    CFG=cfg;toast('✅ Configuración guardada');
  }catch(e){toast('⚠ '+e.message)}
}

async function bankUpload(cat,input){
  const files=[...input.files];input.value='';
  if(!files.length)return;
  let ok=0;
  for(const f of files){
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
      await api('/api/elements',{method:'POST',body:JSON.stringify({category:cat,file:{name:f.name,data_base64:b64}})});
      ok++;
    }catch(e){toast('⚠ '+f.name+': '+e.message)}
  }
  if(ok)toast(`✅ ${ok} elemento(s) añadidos`);
  renderBank();
}

  if(!confirm(`¿Quitar «${file}» del banco?`))return;

  // (actualizar.bat sin reiniciar iniciar.bat): avisar en grande.
  const stale=CAT.server_version&&v.version&&CAT.server_version!==v.version;
  el.innerHTML=(stale?`<div style="background:#7a2e2e;color:#ffd7d7;padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px"><b>⚠ Actualización descargada (${esc(v.version)}) pero NO aplicada.</b><br>Cierra la ventana de iniciar.bat y ábrela de nuevo.</div>`:'')
    +`Versión: <b>${esc((stale?CAT.server_version:v.version)||v.commit||'?')}</b>${v.date?` · ${esc(v.date)}`:''}`
    +`<span class="muted" style="font-size:11px"> · novedades 📋</span>`
    // Solo si hay archivos DEL PROGRAMA tocados, y se NOMBRAN: el aviso
    // anterior era vago y sonaba a «estás desactualizado» sin decir de qué
    // hablaba (saltaba incluso por el material propio dentro de assets/).
    +(v.modified?`<br><span title="${esc((v.modified_files||[]).join('\n'))}\n\nUn «git pull» puede fallar mientras estos archivos difieran del repositorio.">⚠ ${v.modified_count||''} archivo(s) del programa modificados <span class="muted" style="font-size:11px">(pasa el ratón)</span></span>`:'');
}
async function showChangelog(){
  let md='';
  try{md=(await api('/api/changelog')).content}catch(e){toast('⚠ '+e.message);return}
  const html=md.split('\n').map(l=>{
    if(l.startsWith('## '))return `<h3 style="margin:14px 0 4px">${esc(l.slice(3))}</h3>`;
    if(l.startsWith('# '))return `<h2 style="margin:0 0 6px">${esc(l.slice(2))}</h2>`;
    if(l.startsWith('- '))return `<div style="margin:2px 0 2px 14px">• ${esc(l.slice(2))}</div>`;
    return l.trim()?`<div style="margin:2px 0 2px 14px">${esc(l.trim())}</div>`:'';
  }).join('');
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:flex;align-items:center;justify-content:center';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="card" style="max-width:640px;max-height:80vh;overflow:auto;margin:20px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Registro de cambios</b>
      <button class="btn sec small" onclick="this.closest('div[style*=fixed]')?.remove()||this.parentElement.parentElement.parentElement.remove()">✕ Cerrar</button>
    </div><div style="font-size:13px;line-height:1.5">${html}</div></div>`;
  document.body.appendChild(ov);
}
/* ---------- manual de uso ---------- */
let MANUAL=null;
function mdInline(s){
  // imágenes, negrita, código y enlaces — sobre texto YA escapado.
  // Las CAPTURAS van primero: si no, «![alt](ruta)» se convertiría en un
  // enlace y el signo «!» quedaría suelto en el texto.
  return s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
                   '<img src="$2" alt="$1" loading="lazy" style="display:block;width:100%;max-width:820px;border:1px solid var(--line);border-radius:10px;margin:10px 0">')
          .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
          .replace(/`([^`]+)`/g,'<code style="background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px">$1</code>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
}
function mdToHtml(md){
  const out=[];let tbl=null;
  const flush=()=>{if(tbl){out.push(`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;margin:8px 0;font-size:13px">${tbl}</table></div>`);tbl=null}};
  for(const raw of md.split('\n')){
    const l=raw.replace(/^\s+$/,'');
    if(/^<!--/.test(l))continue;
    if(/^\|/.test(l)){
      const cells=l.split('|').slice(1,-1).map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;   // separador
      const tag=tbl===null?'th':'td';
      const style=tag==='th'
        ?'text-align:left;padding:6px 8px;border-bottom:2px solid var(--accent);white-space:nowrap'
        :'padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top';
      tbl=(tbl||'')+`<tr>${cells.map(c=>`<${tag} style="${style}">${mdInline(esc(c))}</${tag}>`).join('')}</tr>`;
      continue;
    }
    flush();
    if(/^###\s/.test(l)){out.push(`<h4 id="${slugify(l.slice(4))}" style="margin:16px 0 4px;color:var(--accent)">${mdInline(esc(l.slice(4)))}</h4>`);continue}
    if(/^##\s/.test(l)){out.push(`<h3 id="${slugify(l.slice(3))}" style="margin:26px 0 8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)">${mdInline(esc(l.slice(3)))}</h3>`);continue}
    if(/^#\s/.test(l)){out.push(`<h2 style="margin:0 0 8px">${mdInline(esc(l.slice(2)))}</h2>`);continue}
    if(/^---+$/.test(l))continue;
    if(/^>\s?/.test(l)){out.push(`<div style="border-left:3px solid var(--accent);background:var(--panel2);padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0">${mdInline(esc(l.replace(/^>\s?/,'')))}</div>`);continue}
    if(/^\s*[-*]\s/.test(l)){out.push(`<div style="margin:3px 0 3px 16px">• ${mdInline(esc(l.replace(/^\s*[-*]\s/,'')))}</div>`);continue}
    if(/^\d+\.\s/.test(l)){out.push(`<div style="margin:3px 0 3px 16px">${mdInline(esc(l))}</div>`);continue}
    if(/^```/.test(l)){out.push(l.length>3?'<pre style="background:var(--panel2);padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px">':'</pre>');continue}
    out.push(l.trim()?`<p style="margin:6px 0">${mdInline(esc(l))}</p>`:'');
  }
  flush();
  return out.join('');
}
function slugify(s){return 'm-'+s.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/g,'-').replace(/^-|-$/g,'')}
async function showManual(){
  view='manual';current=null;stopPoll();refreshList();
  if(!MANUAL){try{MANUAL=await api('/api/manual')}catch(e){toast('⚠ '+e.message);return}}
  const stale=MANUAL.manual_version&&MANUAL.program_version&&MANUAL.manual_version!==MANUAL.program_version;
  const toc=MANUAL.content.split('\n').filter(l=>/^##\s/.test(l))
    .map(l=>l.slice(3).trim())
    .map(t=>`<a href="#${slugify(t)}" onclick="event.preventDefault();document.getElementById('${slugify(t)}')?.scrollIntoView({behavior:'smooth'})" style="display:block;padding:3px 0;font-size:12.5px">${esc(t)}</a>`).join('');
  $('#main').innerHTML=`<div style="max-width:900px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h1 style="margin:0">📖 Manual de uso</h1>
      <div class="row" style="gap:6px">
        <input id="man-q" placeholder="🔎 Buscar en el manual…" oninput="filterManual(this.value)" style="width:220px">
        <a class="btn sec small" href="/api/manual" download="MANUAL.json" title="Descargar el texto">⬇</a>
      </div>
    </div>
    ${stale?`<div class="banner">⚠ Este manual documenta la versión <b>${esc(MANUAL.manual_version)}</b> y el programa está en <b>${esc(MANUAL.program_version)}</b>. Puede faltarle alguna novedad reciente — revisa el registro de cambios.</div>`
           :`<p class="muted" style="font-size:12px">Actualizado para la versión <b>${esc(MANUAL.manual_version||'actual')}</b> del programa.</p>`}
    <div class="row" style="align-items:flex-start;gap:16px">
      <div class="card" style="flex:1;font-size:13.5px;line-height:1.6" id="man-body">${mdToHtml(MANUAL.content)}</div>
      <div class="card" style="width:210px;position:sticky;top:14px;max-height:80vh;overflow:auto" id="man-toc">
        <b style="font-size:12px">Contenido</b>${toc}</div>
    </div></div>`;
}
function filterManual(q){
  const body=$('#man-body');if(!body)return;
  const t=(q||'').trim().toLowerCase();
  if(!t){body.innerHTML=mdToHtml(MANUAL.content);$('#man-toc').style.display='';return}
  const hits=MANUAL.content.split('\n').filter(l=>l.toLowerCase().includes(t)&&l.trim()&&!/^<!--/.test(l));
  $('#man-toc').style.display='none';
  body.innerHTML=hits.length
    ?`<p class="muted" style="font-size:12px">${hits.length} línea(s) con «${esc(q)}»:</p>`+mdToHtml(hits.join('\n'))
    :`<p class="muted">Sin resultados para «${esc(q)}». Prueba con otra palabra (por ejemplo: «costo», «narración», «banco», «rehacer»).</p>`;
}
let EVFILTER='all';
async function showEvents(){
  const main=document.getElementById('main');
  let data;
  try{data=await api('/api/events?limit=500')}
  catch(e){
    if((e.message||'').includes('No encontrado'))
      toast('⚠ El programa sigue ejecutando la versión anterior: cierra la ventana de iniciar.bat y ábrela de nuevo.');
    else toast('⚠ '+e.message);
    return;
  }
  const icon={info:'•',warn:'⚠',error:'✕'};
  const color={info:'var(--muted)',warn:'#E8C46B',error:'#ff6b6b'};
  const evs=data.events.filter(e=>EVFILTER==='all'||e.level===EVFILTER);
  // El log guarda el slug interno (estable aunque renombres el proyecto);
  // se muestra el nombre visible ACTUAL — así un proyecto renombrado o
  // duplicado no aparece con el nombre técnico enterrado.
  const allProjects=window._allProjects||await api('/api/projects').catch(()=>[]);
  const nameOf=slug=>{const p=allProjects.find(x=>x.slug===slug);return p?(p.display_name||slug):slug};
  const rows=evs.map(e=>{
    const sec=(e.seconds!=null)?` <span class="muted">(${e.seconds}s)</span>`:'';
    const ph=e.phase?` <span class="badge">${esc(e.phase)}</span>`:'';
    const pr=e.project?` <span class="muted" style="font-size:11px" title="${esc(e.project)}">${esc(nameOf(e.project))}</span>`:'';
    return `<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <span style="color:${color[e.level]||'var(--muted)'};min-width:14px;text-align:center">${icon[e.level]||'•'}</span>
      <span class="muted" style="font-size:11px;white-space:nowrap">${esc(e.ts||'')}</span>
      <span style="flex:1">${esc(e.message||'')}${sec}${ph}${pr}</span>
    </div>`;
  }).join('')||'<div class="muted" style="padding:14px 0">Aún no hay eventos. Genera un video y aquí quedará el historial de novedades, errores y tiempos.</div>';
  main.innerHTML=`<div style="max-width:820px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h1 style="margin:0">🧾 Log de eventos</h1>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn sec small" onclick="EVFILTER='all';showEvents()">Todo</button>
        <button class="btn sec small" onclick="EVFILTER='warn';showEvents()">Avisos</button>
        <button class="btn sec small" onclick="EVFILTER='error';showEvents()">Errores</button>
        <button class="btn sec small" onclick="showEvents()">↻ Actualizar</button>
        <a class="btn small" href="/api/events/download" download>⬇ Descargar</a>
      </div>
    </div>
    <p class="muted" style="font-size:12px">Cada novedad, aviso, error y el tiempo de cada fase quedan registrados aquí. Descárgalo para compartírmelo si algo falla.</p>
    <div class="card" style="font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace">${rows}</div>
  </div>`;
}
(async function(){
  const data=await api('/api/config');
  CAT=data;CFG=data.config;
  renderVersion();
  await refreshList();
  const projects=await api('/api/projects');
  if(projects.length)openProject(projects[0].slug);else showNew();
})();
