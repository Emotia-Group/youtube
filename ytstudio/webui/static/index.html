<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytstudio — creador de videos</title>
<style>
  :root{
    --bg:#0c0e13; --panel:#141821; --panel2:#1a1f2b; --line:#262d3d;
    --text:#e8eaf0; --muted:#8b93a7; --accent:#f0b429; --accent2:#e8590c;
    --ok:#37b24d; --err:#f03e3e; --run:#4dabf7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px}
  input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
  input:focus,textarea:focus,select:focus{outline:1px solid var(--accent)}
  ::placeholder{color:#5a6178}
  h1{font-size:19px} h2{font-size:16px;margin-bottom:10px} h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
  .btn{background:var(--accent);color:#141414;font-weight:600;padding:10px 18px}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* sidebar */
  #sidebar{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
  #logo{display:flex;align-items:center;gap:9px;margin-bottom:20px;padding:0 4px}
  #logo .clap{font-size:24px}
  #logo small{display:block;color:var(--muted);font-size:11px}
  .navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;color:var(--text);padding:9px 10px;border-radius:8px;margin-bottom:4px}
  .navbtn:hover{background:var(--panel2)}
  .navbtn.active{background:var(--panel2);color:var(--accent)}
  #projlist{flex:1;overflow-y:auto;margin-top:6px}
  #verinfo{font-size:11px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line);margin-top:8px}
  #verinfo b{color:var(--ok)}
  #verinfo.stale b{color:var(--err)}
  .proj{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}
  .proj:hover{background:var(--panel2)}
  .proj.active{background:var(--panel2);outline:1px solid var(--line)}
  .proj .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
  .proj .bar i{display:block;height:100%;background:var(--accent)}
  .proj.running .bar i{background:var(--run)}

  /* main */
  #main{flex:1;overflow-y:auto;padding:26px 34px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .muted{color:var(--muted);font-size:13px}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}

  /* fases */
  #phases{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .phase{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .phase.done{border-color:var(--ok);color:var(--ok)}
  .phase.failed{border-color:var(--err);color:var(--err)}
  .phase.running{border-color:var(--run);color:var(--run);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .banner{border:1px solid var(--accent);background:rgba(240,180,41,.08);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:13.5px}
  .banner b{color:var(--accent)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
  .step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
  .step b{display:block;color:var(--accent);margin-bottom:4px}
  .radio-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .radio-row label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px}
  .radio-row input{width:auto}
  .upcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:10px 0}
  .upcat{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px}
  .upcat b{display:block;margin-bottom:2px}
  .upcat .hint{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}
  .upcat input[type=file]{font-size:12.5px;padding:6px}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;margin-top:6px;font-size:12.5px}
  .filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip button{background:none;color:var(--err);font-size:15px;padding:0 2px}
  .keyfield{display:grid;grid-template-columns:220px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}

  /* log */
  #log{background:#080a0e;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.7 ui-monospace,monospace;max-height:230px;overflow-y:auto;white-space:pre-wrap;display:none}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{background:none;color:var(--muted);padding:9px 16px;border-radius:8px 8px 0 0;font-weight:600}
  .tab.active{color:var(--accent);background:var(--panel)}

  /* storyboard */
  .scene{display:flex;gap:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .scene img{width:240px;height:135px;object-fit:cover;border-radius:8px;background:#000}
  .scene .num{color:var(--accent);font-weight:700;font-size:13px}
  .scene audio{width:100%;height:32px;margin-top:8px}
  .badge{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:11.5px;color:var(--muted);margin-left:6px}

  /* settings */
  .provcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .keydot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .keydot.on{background:var(--ok)} .keydot.off{background:var(--err)}
  .preset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel2)}
  .preset.sel{border-color:var(--accent);outline:1px solid var(--accent)}
  .preset b{display:block;margin-bottom:3px}
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

  #toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:10px;display:none;z-index:50}
  video{width:100%;max-height:520px;border-radius:10px;background:#000}
  textarea#scripted{min-height:420px;font:14px/1.7 ui-monospace,monospace}
  a{color:var(--accent)}
</style>
</head>
<body>

<div id="sidebar">
  <div id="logo"><span class="clap">🎬</span><div><b>ytstudio</b><small>videos largos con IA</small></div></div>
  <button class="navbtn" onclick="showNew()">＋ Nuevo proyecto</button>
  <button class="navbtn" onclick="showSettings()">⚙ Configuración</button>
  <h3 style="padding:0 6px">Proyectos</h3>
  <div id="projlist"></div>
  <div id="verinfo"></div>
</div>

<div id="main"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>(t??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CAT=null, CFG=null, current=null, pollTimer=null, view='home';

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||r.statusText);
  return data;
}
function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',ms)}

/* ---------- sidebar ---------- */
async function refreshList(){
  const projects=await api('/api/projects');
  $('#projlist').innerHTML=projects.map(p=>`
    <div class="proj ${p.slug===current?'active':''} ${p.running?'running':''}" onclick="openProject('${p.slug}')">
      <div class="name">${p.running?'⏳ ':''}${esc(p.slug)}</div>
      <div class="muted">${p.done}/${p.total} fases</div>
      <div class="bar"><i style="width:${100*p.done/p.total}%"></i></div>
    </div>`).join('')||'<div class="muted" style="padding:8px">Sin proyectos aún</div>';
}

/* ---------- nuevo proyecto ---------- */
function showNew(){
  view='new';current=null;stopPoll();refreshList();
  const presets=Object.entries(CAT.style_presets).map(([k,p])=>`
    <div class="preset ${k===(CFG.style?.preset||'ninguno')?'sel':''}" data-k="${k}"
         onclick="document.querySelectorAll('.preset').forEach(e=>e.classList.remove('sel'));this.classList.add('sel')">
      <b>${esc(p.label)}</b><span class="muted">${esc(p.description)}</span>
    </div>`).join('');
  const mock=!CAT.keys.ANTHROPIC_API_KEY;
  $('#main').innerHTML=`
  <h1>Nuevo proyecto</h1>
  <p class="muted">Dale una idea o pega tu guion, y el sistema produce un video largo listo para YouTube: concepto, guion, escenas, voz, imágenes, música, subtítulos y montaje.</p>
  <div class="steps">
    <div class="step"><b>1 · Tú aportas</b>una idea, un guion, una nota de voz, una imagen o un video de referencia.</div>
    <div class="step"><b>2 · La IA produce</b>concepto y estilo, guion, guion gráfico por escenas, voz en off, imágenes y música.</div>
    <div class="step"><b>3 · Se monta</b>todo se une con animación, subtítulos y música: obtienes el video, la miniatura y los metadatos.</div>
  </div>
  ${mock?`<div class="banner">⚠ <b>Modo vista previa activo</b> — sin clave de API, el resultado usa contenido de marcador (para ver cómo funciona). Configura tu clave en ⚙ Configuración para calidad real.</div>`:''}
  <div class="card">
    <label class="f"><span>1 · Nombre del proyecto</span>
      <input id="np-slug" placeholder="ej. la-historia-de-los-faros"></label>
    <label class="f"><span>2 · Escribe tu idea o pega tu guion completo (opcional si subes archivos)</span>
      <textarea id="np-text" rows="6" placeholder="Ejemplo de idea: «Un documental sobre los fareros que salvaron miles de vidas en el siglo XIX».&#10;&#10;O pega aquí tu guion completo y se respetará tal cual."></textarea></label>
    <h3>3 · Archivos (opcional) — puedes subir varios y quitarlos con ✕</h3>
    ${uploadCatsHtml()}
    <h3>4 · Estilo del video</h3>
    <div class="presets">${presets}</div>
    <br><button class="btn" onclick="createProject()">Crear proyecto →</button>
  </div>`;
  window._pending=[];
}

const UPLOAD_CATS=[
  ['guion','📄 Guion o idea','Documentos con tu guion: PDF, Word (.docx), PowerPoint, Excel, .txt, .md','.txt,.md,.pdf,.docx,.doc,.pptx,.xlsx,.xls'],
  ['voz','🎙 Nota de voz / narración','Audio con tu idea o narración: se transcribe como base del guion (mp3, wav, m4a…)','audio/*'],
  ['broll','🎬 Tu B-roll (imágenes y videos)','Tus propias imágenes/videos: se usan directamente en el montaje del video','image/*,video/*'],
  ['referencia','🎨 Referencia de estilo','Imagen o video cuyo estilo/tema quieres imitar: se analiza con IA','image/*,video/*'],
];
function uploadCatsHtml(){
  return `<div class="upcats">${UPLOAD_CATS.map(([k,label,hint,accept])=>`
    <div class="upcat"><b>${label}</b><span class="hint">${hint}</span>
      <input type="file" multiple accept="${accept}" onchange="addPending('${k}',this)">
      <div id="chips-${k}"></div>
    </div>`).join('')}</div>`;
}
function addPending(cat,input){
  window._pending=window._pending||[];
  for(const f of input.files){
    if(f.size>300*1024*1024){toast(`«${f.name}» supera 300 MB — omitido`);continue}
    window._pending.push({file:f,category:cat});
  }
  input.value='';
  renderChips();
}
function removePending(i){window._pending.splice(i,1);renderChips()}
function renderChips(){
  UPLOAD_CATS.forEach(([k])=>{const el=$('#chips-'+k);if(el)el.innerHTML=''});
  (window._pending||[]).forEach((p,i)=>{
    const el=$('#chips-'+p.category);
    if(el)el.insertAdjacentHTML('beforeend',
      `<div class="filechip"><span title="${esc(p.file.name)}">${esc(p.file.name)}</span>
       <em class="muted" style="font-size:11px">${(p.file.size/1048576).toFixed(1)} MB</em>
       <button title="Quitar" onclick="removePending(${i})">✕</button></div>`);
  });
}
function readB64(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(f)})}
async function createProject(){
  const slug=$('#np-slug').value.trim(), text=$('#np-text').value.trim();
  const pending=window._pending||[];
  if(!slug){toast('Ponle un nombre al proyecto');return}
  if(!text&&!pending.length){toast('Escribe una idea/guion o sube al menos un archivo');return}
  const btn=document.querySelector('button.btn[onclick="createProject()"]');
  if(btn){btn.disabled=true;btn.textContent='Subiendo…'}
  try{
    const files=[];
    for(const p of pending){
      files.push({name:p.file.name,data_base64:await readB64(p.file),category:p.category});
    }
    const r=await api('/api/projects',{method:'POST',body:JSON.stringify(
      {slug,text,files,style_preset:document.querySelector('.preset.sel')?.dataset.k})});
    toast(`Proyecto creado con ${r.assets.length} archivo(s)`);
    openProject(r.slug);
  }catch(e){toast('⚠ '+e.message);if(btn){btn.disabled=false;btn.textContent='Crear proyecto →'}}
}

/* ---------- proyecto ---------- */
async function openProject(slug){
  view='project';current=slug;refreshList();
  await renderProject();startPoll();
}
function phaseLabel(name){return (CAT.phases.find(p=>p.name===name)||{}).label||name}
function phaseChipsHtml(p,curPhase){
  return CAT.phases.map(ph=>{
    let st=p.phases[ph.name];
    const isCur=curPhase===ph.name;
    const cls=isCur?'running':(st==='done'?'done':st==='failed'?'failed':'');
    const icon=isCur?'⏳':({done:'✔',failed:'✖'}[st]||'·');
    return `<div class="phase ${cls}" title="${esc(ph.desc)}">${icon} ${esc(ph.label)}</div>`;
  }).join('');
}
async function renderProject(activeTab){
  const p=await api('/api/projects/'+current);
  const running=p.running;
  const mock=!CAT.keys.ANTHROPIC_API_KEY;
  const failed=Object.entries(p.phases).find(([,s])=>s==='failed');
  const tabs=[['Guion','📝'],['Storyboard','🎞'],['Video','▶'],['Concepto','💡'],['Archivos','📎']];
  const tab=activeTab||window._tab||'Guion';window._tab=tab;
  $('#main').innerHTML=`
  <div class="row" style="justify-content:space-between">
    <h1>🎬 ${esc(current)}</h1>
    <div class="row">
      <select id="run-to" style="width:auto" title="Hasta dónde generar">
        <option value="">Generar el video completo</option>
        <option value="script">Solo el guion (revisar antes)</option>
        <option value="scenes">Hasta el guion gráfico</option>
      </select>
      <button class="btn" id="btn-run" ${running?'disabled':''} onclick="runPipeline()">${running?'⏳ Generando…':'▶ Generar video'}</button>
      <select id="run-from" style="width:auto" onchange="rerunFrom(this.value)" ${running?'disabled':''} title="Rehacer desde un paso">
        <option value="">Rehacer desde…</option>
        ${CAT.phases.map(ph=>`<option value="${ph.name}">${esc(ph.label)}</option>`).join('')}
      </select>
      <button class="btn sec small" title="Borrar proyecto" ${running?'disabled':''} onclick="deleteProject()">🗑</button>
    </div>
  </div>
  ${mock?`<div class="banner">⚠ <b>Modo vista previa</b> — no hay clave de API configurada (<code>ANTHROPIC_API_KEY</code>), así que el video se generará con contenido de marcador (voz silenciosa, imágenes de relleno). Tu guion <b>sí se respeta</b>. Para calidad real, añade tu clave en el archivo <code>.env</code> y elige los proveedores en ⚙ Configuración.</div>`:''}
  <div class="muted" style="margin:6px 0 2px">Progreso — se generan 11 pasos en orden${running&&p.phase?`. Ahora: <b style="color:var(--run)">${esc(phaseLabel(p.phase))}</b>`:''}:</div>
  <div id="phases">${phaseChipsHtml(p,running?p.phase:null)}</div>
  ${p.total_duration?`<div class="muted">Duración estimada: ${Math.round(p.total_duration)}s · ${p.scene_count||0} escenas</div>`:''}
  ${failed?`<div class="card" style="border-color:var(--err)">✖ Se detuvo en el paso <b>${esc(phaseLabel(failed[0]))}</b>:<br><span class="muted">${esc(p.phase_info[failed[0]]?.error||'')}</span><br><br>Corrige lo indicado y pulsa <b>▶ Generar video</b> para reanudar desde ahí.</div>`:''}
  <pre id="log"></pre>
  <div class="tabs" style="margin-top:16px">${tabs.map(([t,ic])=>`<button class="tab ${t===tab?'active':''}" onclick="switchTab('${t}')">${ic} ${t}</button>`).join('')}</div>
  <div id="tabbody"></div>`;
  if(running){$('#log').style.display='block'}
  renderTab(tab,p);
}
function switchTab(t){window._tab=t;renderProject(t)}

async function renderTab(tab,p){
  const el=$('#tabbody');
  if(tab==='Guion'){
    if(!p.has_script){el.innerHTML='<div class="card muted">Aún no hay guion. Ejecuta el pipeline (puedes elegir "Solo hasta el guion" para revisarlo antes de producir).</div>';return}
    const s=await api(`/api/projects/${current}/script`);
    el.innerHTML=`<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <span class="muted">Edita libremente — al guardar se regeneran las fases posteriores.</span>
        <button class="btn small" onclick="saveScript()">💾 Guardar guion</button></div>
      <textarea id="scripted">${esc(s.content)}</textarea></div>`;
  }
  else if(tab==='Storyboard'){
    if(!p.scenes){el.innerHTML='<div class="card muted">Aún no hay escenas (fase «scenes»).</div>';return}
    el.innerHTML=p.scenes.map(s=>`
      <div class="scene">
        ${s.broll_image?`<img src="/files/${current}/06_broll/${s.broll_image}" loading="lazy">`:'<div style="width:240px" class="muted">sin imagen aún</div>'}
        <div style="flex:1">
          <div class="num">ESCENA ${s.id} — ${esc(s.section)}
            <span class="badge">${s.animation}</span><span class="badge">${s.broll_type}</span>
            ${s.duration?`<span class="badge">${s.duration.toFixed(1)}s</span>`:''}</div>
          <p style="margin:6px 0">${esc(s.narration)}</p>
          <div class="muted" style="font-size:12px">🎨 ${esc(s.broll_prompt)}</div>
          ${s.on_screen_text?`<div class="muted">🔤 Texto en pantalla: <b>${esc(s.on_screen_text)}</b></div>`:''}
          ${s.vo_file?`<audio controls preload="none" src="/files/${current}/05_voiceover/${s.vo_file}"></audio>`:''}
        </div>
      </div>`).join('');
  }
  else if(tab==='Video'){
    if(!p.final_video){el.innerHTML='<div class="card muted">El video final aparecerá aquí al terminar la fase de montaje.</div>';return}
    const m=p.metadata_full||{};
    el.innerHTML=`<div class="card">
      <video controls src="/files/${current}/${p.final_video}"></video>
      <div class="row" style="margin-top:14px;align-items:flex-start">
        ${p.thumbnail?`<div><h3>Miniatura</h3><img src="/files/${current}/${p.thumbnail}" style="width:320px;border-radius:8px"></div>`:''}
        <div style="flex:1;min-width:280px">
          <h3>Metadatos</h3>
          <b>${esc(m.title||'')}</b>
          <p class="muted" style="white-space:pre-wrap;max-height:180px;overflow-y:auto">${esc(m.description||'')}</p>
          <div class="muted">🏷 ${(m.tags||[]).map(esc).join(', ')}</div>
        </div>
      </div>
      <br><div class="muted">Archivos: <a href="/files/${current}/${p.final_video}" download>video_final.mp4</a> ·
        <a href="/files/${current}/08_subtitles/subtitulos.srt" download>subtitulos.srt</a> ·
        ${p.thumbnail?`<a href="/files/${current}/${p.thumbnail}" download>miniatura.jpg</a>`:''}</div>
    </div>`;
  }
  else if(tab==='Archivos'){
    const catLabel={guion:'📄 Guion',voz:'🎙 Voz',broll:'🎬 B-roll propio',referencia:'🎨 Referencia'};
    const rows=(p.assets||[]).map(a=>`
      <div class="filechip" style="max-width:640px">
        <span class="badge" style="margin:0">${catLabel[a.category]||a.category}</span>
        <span title="${esc(a.name)}">${esc(a.name)}</span>
        <button title="Borrar" onclick="deleteAsset(${a.id})">✕</button>
      </div>`).join('');
    el.innerHTML=`<div class="card">
      <div class="muted" style="margin-bottom:10px">${p.has_text_input?'✔ Este proyecto también tiene texto pegado como material principal.':''}
      Al añadir o borrar archivos se vuelve a analizar el material (los pasos se regeneran).</div>
      ${rows||'<div class="muted">No hay archivos subidos.</div>'}
      <h3>Añadir más archivos</h3>
      ${uploadCatsHtml()}
      <button class="btn small" onclick="uploadPending()">⬆ Subir seleccionados</button>
    </div>`;
    window._pending=[];
  }
  else if(tab==='Concepto'){
    const c=p.concept;
    if(!c){el.innerHTML='<div class="card muted">El concepto se genera en la fase 2.</div>';return}
    el.innerHTML=`<div class="card">
      <h3>Títulos propuestos</h3>${(c.title_options||[]).map(t=>`<div>• ${esc(t)}</div>`).join('')}
      <div class="grid2" style="margin-top:14px">
        <div><h3>Ángulo</h3>${esc(c.angle)}</div><div><h3>Audiencia</h3>${esc(c.audience)}</div>
        <div><h3>Tono</h3>${esc(c.tone)}</div><div><h3>Música</h3>${esc(c.music_direction?.mood)} — ${esc(c.music_direction?.description)}</div>
      </div>
      <h3>Estructura</h3>${(c.structure||[]).map((s,i)=>`<div>${i+1}. ${esc(s)}</div>`).join('')}
      <h3>Estilo visual</h3><p>${esc(c.visual_style?.description)}</p>
      <div class="muted">Prefijo de prompts: <code>${esc(c.visual_style?.prompt_prefix)}</code></div>
      <div class="row" style="margin-top:8px">${(c.visual_style?.palette||[]).map(h=>`<span style="background:${esc(h)};width:34px;height:22px;border-radius:5px;display:inline-block" title="${esc(h)}"></span>`).join('')}</div>
    </div>`;
  }
}
async function deleteProject(){
  if(!confirm(`¿Borrar el proyecto «${current}» y todos sus archivos generados? Esta acción no se puede deshacer.`))return;
  try{await api('/api/projects/'+current,{method:'DELETE'});
    toast('Proyecto borrado');current=null;await refreshList();showNew();
  }catch(e){toast('⚠ '+e.message)}
}
async function deleteAsset(id){
  if(!confirm('¿Borrar este archivo del proyecto? Se volverá a analizar el material.'))return;
  try{await api(`/api/projects/${current}/assets/${id}`,{method:'DELETE'});
    toast('Archivo borrado');renderProject('Archivos');refreshList();
  }catch(e){toast('⚠ '+e.message)}
}
async function uploadPending(){
  const pending=window._pending||[];
  if(!pending.length){toast('Selecciona archivos primero');return}
  try{
    const files=[];
    for(const p of pending){
      files.push({name:p.file.name,data_base64:await readB64(p.file),category:p.category});
    }
    await api(`/api/projects/${current}/assets`,{method:'POST',body:JSON.stringify({files})});
    window._pending=[];
    toast(`${files.length} archivo(s) añadidos`);renderProject('Archivos');refreshList();
  }catch(e){toast('⚠ '+e.message)}
}
async function saveScript(){
  try{await api(`/api/projects/${current}/script`,{method:'PUT',body:JSON.stringify({content:$('#scripted').value})});
    toast('Guion guardado — las fases posteriores se regenerarán');renderProject('Guion');
  }catch(e){toast('⚠ '+e.message)}
}
async function runPipeline(){
  try{await api(`/api/projects/${current}/run`,{method:'POST',body:JSON.stringify({to:$('#run-to').value||null})});
    startPoll();renderProject();
  }catch(e){toast('⚠ '+e.message)}
}
async function rerunFrom(phase){
  if(!phase)return;
  if(!confirm(`¿Rehacer desde el paso «${phaseLabel(phase)}»? Se regenerarán ese paso y los siguientes.`))return;
  try{await api(`/api/projects/${current}/run`,{method:'POST',body:JSON.stringify({from:phase})});
    startPoll();renderProject();
  }catch(e){toast('⚠ '+e.message)}
}

/* ---------- polling ---------- */
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function startPoll(){
  stopPoll();
  let lastCount=-1,wasRunning=false,lastPhase=null;
  pollTimer=setInterval(async()=>{
    if(view!=='project'||!current){stopPoll();return}
    const log=await api(`/api/projects/${current}/log`);
    const el=$('#log');
    if(el&&(log.running||log.lines.length)){
      el.style.display='block';
      if(log.lines.length!==lastCount){el.textContent=log.lines.join('\n');el.scrollTop=el.scrollHeight;lastCount=log.lines.length;}
      if(log.running&&log.phase!==lastPhase){lastPhase=log.phase;renderPhasesOnly(log.phase);}
    }
    if(wasRunning&&!log.running){
      if(!log.error){
        const d=await api('/api/projects/'+current);
        if(d.final_video)window._tab='Video';  // mostrar el resultado directamente
      }
      await renderProject();refreshList();
      toast(log.error?'⚠ '+log.error:'✅ ¡Video generado!');
    }
    wasRunning=log.running;
  },1500);
}
async function renderPhasesOnly(curPhase){
  const p=await api('/api/projects/'+current);
  const el=$('#phases');if(el)el.innerHTML=phaseChipsHtml(p,curPhase);
}

/* ---------- configuración ---------- */
function provCard(catKey){
  const cat=CAT.catalog[catKey];
  const cur=CFG.providers[catKey]||{};
  const opts=cat.options.map(o=>{
    const key=o.env?`<span class="keydot ${CAT.keys[o.env]?'on':'off'}"></span><span class="muted" style="font-size:12px">${o.env}${CAT.keys[o.env]?'':' (no definida)'}</span>`:'<span class="keydot on"></span><span class="muted" style="font-size:12px">sin clave</span>';
    return `<label style="display:flex;gap:8px;align-items:center;margin-bottom:6px;cursor:pointer">
      <input type="radio" name="prov-${catKey}" value="${o.name}" ${cur.name===o.name?'checked':''} style="width:auto" onchange="renderModelPick('${catKey}')">
      <b>${esc(o.label)}</b> ${key}
    </label><div class="muted" style="margin:0 0 10px 24px;font-size:12.5px">${esc(o.notes||'')}</div>`;
  }).join('');
  return `<div class="provcard" id="cat-${catKey}">
    <h2>${esc(cat.title)}</h2>${opts}
    <div id="models-${catKey}"></div>
  </div>`;
}
function renderModelPick(catKey){
  const cat=CAT.catalog[catKey];
  const sel=document.querySelector(`input[name=prov-${catKey}]:checked`)?.value;
  const opt=cat.options.find(o=>o.name===sel)||{};
  const cur=CFG.providers[catKey]||{};
  let html='';
  const items=opt.models||opt.voices||[];
  if(items.length){
    const field=opt.voices?'voice':'model';
    const curVal=cur[field]||items[0].id;
    html+=`<label class="f"><span>${opt.voices?'Voz':'Modelo'}</span>
      <select id="pick-${catKey}" onchange="$('#free-${catKey}').value=this.value">
        ${items.map(m=>`<option value="${m.id}" ${m.id===curVal?'selected':''}>${esc(m.label)}</option>`).join('')}
      </select></label>
      <label class="f"><span>o escribe un ${opt.voices?'voice_id':'modelo'} personalizado</span>
      <input id="free-${catKey}" value="${esc(curVal)}"></label>`;
  }
  (cat.extra_fields||[]).forEach(f=>{
    html+=`<label class="f"><span>${esc(f.label)}</span>
      <input type="number" id="extra-${catKey}-${f.key}" value="${cur[f.key]??0}">
      <span class="muted" style="font-size:12px">${esc(f.hint||'')}</span></label>`;
  });
  $('#models-'+catKey).innerHTML=html;
}
function showSettings(){
  view='settings';current=null;stopPoll();refreshList();
  const cats=Object.keys(CAT.catalog);
  const presets=Object.entries(CAT.style_presets).map(([k,p])=>`
    <div class="preset ${k===(CFG.style?.preset||'ninguno')?'sel':''}" data-k="${k}"
      onclick="document.querySelectorAll('#stylegrid .preset').forEach(e=>e.classList.remove('sel'));this.classList.add('sel')">
      <b>${esc(p.label)}</b><span class="muted">${esc(p.description)}</span>
      ${p.fps?`<span class="badge">${p.fps} fps</span>`:''}
    </div>`).join('');
  $('#main').innerHTML=`
  <div class="row" style="justify-content:space-between"><h1>⚙ Configuración</h1>
    <button class="btn" onclick="saveSettings()">💾 Guardar configuración</button></div><br>
  <div class="card"><h2>🔑 Claves de API</h2>
    <p class="muted" style="margin-bottom:12px">Pega aquí tus claves y pulsa Guardar — se almacenan en tu archivo local <code>.env</code> y se activan al instante. La mínima recomendada es la de Anthropic (Claude), que genera el concepto, el guion y las escenas: consíguela en <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys.</p>
    ${[['ANTHROPIC_API_KEY','Anthropic (Claude) — guion, concepto, escenas'],
       ['OPENAI_API_KEY','OpenAI — voz TTS, Whisper, imágenes'],
       ['ELEVENLABS_API_KEY','ElevenLabs — voces premium'],
       ['REPLICATE_API_TOKEN','Replicate — FLUX, Kling, MusicGen']].map(([k,label])=>`
      <div class="keyfield">
        <span style="font-size:13px">${label}</span>
        <input type="password" id="key-${k}" placeholder="${CAT.keys[k]?'●●●●●●●● (ya configurada — escribe para reemplazar)':'pega tu clave aquí'}">
        <span class="keydot ${CAT.keys[k]?'on':'off'}" title="${CAT.keys[k]?'configurada':'sin configurar'}"></span>
      </div>`).join('')}
    <button class="btn small" onclick="saveKeys()">💾 Guardar claves</button>
  </div>
  <div class="card"><h2>Estilo por defecto</h2>
    <div class="presets" id="stylegrid">${presets}</div></div>
  <div class="card"><h2>Video</h2>
    <div class="grid2">
      <label class="f"><span>Duración objetivo (minutos)</span><input type="number" id="v-min" value="${CFG.video.target_minutes}"></label>
      <label class="f"><span>Resolución</span>
        <select id="v-res">
          <option value="1920x1080" ${CFG.video.width===1920?'selected':''}>1920×1080 (Full HD)</option>
          <option value="2560x1440" ${CFG.video.width===2560?'selected':''}>2560×1440 (2K)</option>
          <option value="3840x2160" ${CFG.video.width===3840?'selected':''}>3840×2160 (4K)</option>
        </select></label>
      <label class="f"><span>Subtítulos</span>
        <select id="v-subs">
          <option value="false" ${!CFG.video.burn_subtitles?'selected':''}>Pista activable (recomendado para YouTube)</option>
          <option value="true" ${CFG.video.burn_subtitles?'selected':''}>Quemados en el video</option>
        </select></label>
      <label class="f"><span>Idioma</span><input id="v-lang" value="${esc(CFG.language)}"></label>
    </div></div>
  <h3 style="font-size:15px">Módulo de integraciones — modelos de IA</h3>
  ${cats.map(provCard).join('')}
  <div class="card"><h2>Audio</h2>
    <div class="grid2">
      <label class="f"><span>Volumen de música (dB bajo la voz)</span><input type="number" id="a-db" value="${CFG.audio.music_db}"></label>
      <label class="f"><span>Ducking automático</span>
        <select id="a-duck"><option value="true" ${CFG.audio.duck?'selected':''}>Activado</option>
        <option value="false" ${!CFG.audio.duck?'selected':''}>Desactivado</option></select></label>
    </div></div>`;
  cats.forEach(renderModelPick);
}
async function saveKeys(){
  const keys={};
  for(const k of ['ANTHROPIC_API_KEY','OPENAI_API_KEY','ELEVENLABS_API_KEY','REPLICATE_API_TOKEN']){
    const v=$('#key-'+k)?.value.trim();
    if(v)keys[k]=v;
  }
  if(!Object.keys(keys).length){toast('Pega al menos una clave');return}
  try{
    const r=await api('/api/keys',{method:'PUT',body:JSON.stringify({keys})});
    CAT.keys=r.keys;
    toast('✅ Claves guardadas y activas');
    showSettings();
  }catch(e){toast('⚠ '+e.message)}
}
async function saveSettings(){
  const cfg=JSON.parse(JSON.stringify(CFG));
  cfg.style={preset:document.querySelector('#stylegrid .preset.sel')?.dataset.k||'ninguno'};
  cfg.video.target_minutes=+$('#v-min').value||10;
  const [w,h]=$('#v-res').value.split('x').map(Number);
  cfg.video.width=w;cfg.video.height=h;
  cfg.video.burn_subtitles=$('#v-subs').value==='true';
  cfg.language=$('#v-lang').value||'es';
  cfg.audio.music_db=+$('#a-db').value; cfg.audio.duck=$('#a-duck').value==='true';
  for(const catKey of Object.keys(CAT.catalog)){
    const sel=document.querySelector(`input[name=prov-${catKey}]:checked`)?.value;
    if(!sel)continue;
    cfg.providers[catKey]=cfg.providers[catKey]||{};
    cfg.providers[catKey].name=sel;
    const opt=CAT.catalog[catKey].options.find(o=>o.name===sel)||{};
    const free=$(`#free-${catKey}`);
    if(free&&free.value){cfg.providers[catKey][opt.voices?'voice':'model']=free.value}
    (CAT.catalog[catKey].extra_fields||[]).forEach(f=>{
      const el=$(`#extra-${catKey}-${f.key}`);if(el)cfg.providers[catKey][f.key]=+el.value||0;
    });
  }
  try{await api('/api/config',{method:'PUT',body:JSON.stringify({config:cfg})});
    CFG=cfg;toast('✅ Configuración guardada');
  }catch(e){toast('⚠ '+e.message)}
}

/* ---------- init ---------- */
function renderVersion(){
  const v=CAT.version||{};
  const el=$('#verinfo');if(!el)return;
  el.className=v.modified?'stale':'';
  el.innerHTML=`Versión: <b>${esc(v.commit||'?')}</b>${v.date?` · ${esc(v.date)}`:''}`
    +(v.modified?'<br>⚠ hay cambios locales sin actualizar':'');
}
(async function(){
  const data=await api('/api/config');
  CAT=data;CFG=data.config;
  renderVersion();
  await refreshList();
  const projects=await api('/api/projects');
  if(projects.length)openProject(projects[0].slug);else showNew();
})();
</script>
