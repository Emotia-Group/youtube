language: es
ui:
  template: nueva          # PLANTILLA DE LA INTERFAZ (el aspecto del programa):
                           #   nueva   · la interfaz editorial de la v0.59, con
                           #             modo claro/oscuro y pestañas Corrida ·
                           #             Material · Guion · Escenas ·
                           #             Personajes · Metadatos
                           #   clasica · la interfaz oscura anterior, con las
                           #             pestañas Guion · Storyboard · Editor ·
                           #             Video · Concepto · Archivos
                           # Se cambia sin tocar este archivo, desde la propia
                           # interfaz, y el MANUAL se sirve con las capturas de
                           # la plantilla que estés usando. Las dos hablan con
                           # el mismo motor: los proyectos no se ven afectados.
style:
  preset: documental_cinematografico
video:
  width: 1920
  height: 1080
  fps: 24
  target_minutes: 10
  scene_padding: 0.35
  transition: auto         # transiciones entre escenas: auto (varía según la
                           # historia) · fade (todas fundido) · none (todas corte)
  burn_subtitles: false
  scene_seconds: 6           # ritmo visual: cada cuántos segundos cambia la imagen
                             # 5-6 dinámico · 8-10 estándar · 14+ contemplativo
  overlays: true             # rótulos cinematográficos en los momentos clave
  overlay_accent: E8C46B     # color de acento de los rótulos (dorado cine)
  overlay_plate: true        # rótulos CON DISEÑO: placa de fondo (contraste
                             # sobre cualquier B-roll), filete de acento y la
                             # palabra clave en color. false = texto pelado
                             # (el estilo clásico anterior a la v0.47.0)
  overlay_style: documental  # documental (placa oscura sobria) · minimal (sin
                             # placa, solo filete) · bold (placa del color de
                             # acento con texto oscuro, máxima presencia)
  elements: true             # INSERTOS documentales sobre el B-roll: foto real
                             # del personaje/lugar mencionado (banco propio en
                             # assets/elements/ o Wikimedia con licencia libre y
                             # crédito automático en la descripción), cifras con
                             # cuenta ascendente y fechas en tarjeta ($0, local).
                             # Densidad: máx 1 por escena y ~1 de cada 3-4.
  elements_web: true         # permite descargar fotos LIBRES de Wikimedia para
                             # los insertos (si no, solo banco propio y tarjetas)
  elements_ai: false         # ÚLTIMO recurso para los insertos sin foto libre:
                             # ilustrarlos con IA. CUESTA como una imagen de
                             # B-roll cada uno (~$0.04 con FLUX), por eso viene
                             # apagado — enciéndelo si prefieres cobertura total
  elements_ai_max: 3         # tope de ilustraciones IA por video (freno de mano)
  elements_map_zoom: 5       # acercamiento de los MAPAS localizadores: 3-4 vista
                             # continental · 5-6 país/región (recomendado) ·
                             # 8-10 ciudad. Cartografía de OpenStreetMap (libre,
                             # con crédito automático); si el servicio no
                             # responde, el localizador se resuelve con una
                             # imagen real del lugar (nunca una ficha vacía)
providers:
  llm:
    name: anthropic
    model: claude-opus-4-8
  tts:
    name: mock               # cartesia = la voz de pago por uso más barata
                             # (~$11/millón de caracteres frente a ~$120 de
                             # elevenlabs: ~$0.10 por video de 10 min en vez
                             # de ~$1.08) y, al cobrar por uso, su gasto SÍ
                             # entra en el tope de presupuesto · elevenlabs =
                             # la mejor calidad, va contra tu plan · edge =
                             # gratis · openai = intermedio
    voice: ''
  stt:
    name: mock               # assemblyai = 2.4x más barato que whisper
                             # ($0.0025/min) y con marcas de tiempo por
                             # palabra más finas, que es de lo que viven las
                             # respiraciones, el recorte de pausas y la
                             # sincronía de subtítulos y rótulos · openai =
                             # Whisper (límite de 25MB por archivo)
  images:
    name: replicate          # FLUX 1.1 Pro: fotorrealismo cine a ~$0.04/img,
                             # sin el cuello de 5 img/min de OpenAI. Las
                             # escenas con TEXTO LEGIBLE van solas a
                             # GPT Image 2 (con OPENAI_API_KEY). Sin
                             # REPLICATE_API_TOKEN degrada a mock avisando.
    model: black-forest-labs/flux-1.1-pro
    quality: medium          # SOLO con name: openai. En GPT Image 2 la
                             # calidad manda el precio mucho más que el
                             # tamaño: low ≈ $0.005 · medium ≈ $0.03-0.06
                             # (recomendado: el texto ya sale limpio) ·
                             # high ≈ hasta $0.21 por imagen
    upscale: false           # ── MODO HÍBRIDO: LA MAYOR PALANCA DE AHORRO ──
                             # Genera con un modelo BARATO y sube después la
                             # resolución. Con model: flux-schnell (~$0.003)
                             # + escalado (~$0.002), las ~100 imágenes de un
                             # documental de 10 min pasan de ~$4.50 a ~$0.50
                             # (-90%). Lo que el escalado NO hace es inventar
                             # la microtextura y el detalle de iluminación de
                             # un modelo caro: recupera resolución, no calidad
                             # de origen. Pruébalo con tu tema antes de
                             # adoptarlo para la versión final.
                             # Las imágenes que YA dan la talla (tu B-roll,
                             # los respaldos locales) se saltan solas: activar
                             # esto nunca cobra de más por ellas.
    upscale_model: nightmareai/real-esrgan   # ~$0.002/img (recomendado) ·
                             # philz1337x/clarity-upscaler ~$0.015 (más
                             # detalle inventado) · recraft-ai/recraft-crisp-
                             # upscale ~$0.008 (bordes limpios)
    ref_model: google/nano-banana   # identidad de personajes del elenco:
                                    # genera con sus fotos de referencia
                                    # (misma cara en todas sus escenas)
    size: 1536x1024          # GPT Image horizontal (16:9); solo aplica a openai
    safety_tolerance: 6      # FLUX 1(estricto)-6(permisivo): evita falsos NSFW
                             # en contenido histórico/bélico (solo aplica a FLUX)
    fact_check_retries: 2    # rondas de corrección del control factual: cada
                             # ronda revisa SOLO lo regenerado en la anterior,
                             # así el gasto crece con los fallos reales. 1 =
                             # una sola corrección (como hasta v0.52.0)
    fact_check: true         # CONTROL DE CALIDAD FACTUAL con visión: el director
                             # compara cada imagen generada con los hechos de su
                             # narración (vivo/muerto, especie, cantidades,
                             # ubicación de heridas) y regenera UNA vez las que
                             # los contradicen. Cuesta unos centavos de visión
                             # por video + el costo de las imágenes corregidas.
  videogen:
    name: none
    model: kwaivgi/kling-v1.6-standard
                             # google/veo-3.1-fast (~$0.75/clip 5s) es el
                             # ÚNICO que devuelve el clip CON SU PROPIO
                             # SONIDO, sincronizado con lo que se ve; los
                             # demás llegan mudos y el ambiente se sintetiza
                             # aparte. Reserva Veo para el gancho y el clímax
                             # (max_scenes 3-5): a 100 escenas sería carísimo
    max_scenes: 0
  lipsync:
    name: replicate           # personaje narrador (imagen + voz → lipsync);
    model: cjwbw/sadtalker    # económico y fiable por defecto — sube a
                              # hedra/character-3 (~$0.07/s: la mitad que
                              # OmniHuman con calidad muy por encima de
                              # Sonic) o a bytedance/omni-human para el techo
  music:
    name: mock               # elevenlabs = LICENCIA COMERCIAL LIMPIA, la
                             # opción defendible para un canal que monetiza
                             # (Suno y Udio suenan mejor pero no tienen API
                             # pública y su licencia estaba en litigio) ·
                             # library = tus pistas, gratis · replicate =
                             # MusicGen
    model: meta/musicgen
    library_dir: assets/music
    multi_track: true        # con biblioteca local y video largo (>3 min), la
                             # banda sonora se arma por ACTOS: una pista por
                             # tramo de intensidad, fundidas con crossfade —
                             # en vez de una sola pista plana todo el video
budget:
  # TOPE DE GASTO DINÁMICO: se calcula solo, a partir de la estimación de lo
  # que FALTA por generar en este proyecto (y se recalcula antes de cada fase,
  # así que tras «Escenas» ya usa el nº exacto de escenas). Protege una prueba
  # corta con un tope pequeño y deja pasar un documental largo con el suyo,
  # sin números fijos que estorben.
  margin: 1.4                # tope = costo ALTO estimado x este margen. El
                             # margen absorbe reintentos legítimos; un
                             # desbocamiento real (10x) sí lo frena.
  min_usd: 1.5               # piso: por debajo, el tope sería hipersensible
  max_usd: 0                 # techo ABSOLUTO opcional (0 = sin techo manual).
                             # Si lo pones, manda solo cuando sea MÁS
                             # restrictivo que el automático — es un candado
                             # extra, nunca un permiso para gastar más.
reference:
  max_minutes: 12            # minutos a descargar/analizar del video de referencia
  video_height: 480          # resolución de análisis (baja = rápido y suficiente)
performance:
  parallel_images: 4         # imágenes IA generadas a la vez
  parallel_video: 2          # clips de video IA a la vez (corren en el servidor)
  parallel_tts: 4            # voces por escena a la vez
  parallel_render: 2         # escenas montadas a la vez (según tu CPU: 2-4)
audio:
  music_db: -21
  duck: true
  vo_lufs: -16
  intensity_db: 8            # cuánto sube/baja la música según la intensidad
                             # dramática de cada escena (dB de recorrido)
  sfx: true                  # efectos incidentales en los cortes: whoosh, riser,
                             # boom, papel (archivo/documentos) y latido
                             # (suspenso), más el acento de los insertos
  sfx_db: -18                # volumen de los efectos (propios en assets/sfx)
  element_sfx: auto          # SONIDO DE LOS INSERTOS documentales (la foto de
                             # archivo, la cifra animada, el mapa). Paletas:
                             #   auto     · según el estilo del video
                             #   archivo  · papel + tic de proyector (documental)
                             #   sobrio   · un soplo de aire, casi imperceptible
                             #   epico    · cuerdas breves que crecen
                             #   oficina  · sello y clic de mecanismo
                             #   moderno  · el 'pop' de app de siempre
                             #   ninguno  · los insertos entran mudos
                             # También admite el nombre de un efecto suelto
                             # (papel, clic, aire, cuerda, sello, pop) para que
                             # todos suenen igual.
  ambience: true             # CAMA DE AMBIENTE por actos: el director de sonido
                             # elige el fondo de cada tramo (viento, multitud,
                             # sala, lluvia, mar, fuego, tensión) según lo que se
                             # narra. Usa tus archivos de assets/sfx/ambientes/
                             # y, si no hay, los sintetiza en local (gratis).
  ambience_db: -30           # volumen de la cama de ambiente (muy por debajo de
                             # la voz: acompaña, no protagoniza)
  native_audio: true         # SONIDO PROPIO DE LOS CLIPS: Veo 3.1 devuelve el
                             # video con su ambiente ya sincronizado con lo que
                             # se ve (pasos sobre grava, viento, una plaza).
                             # Se coloca en su escena, por encima de la cama
                             # sintética y por debajo de la voz. Los demás
                             # modelos de video llegan mudos y esto no aplica
  native_audio_db: -24       # volumen del sonido nativo. Por encima del
                             # ambiente (-30) porque es el sonido REAL de esa
                             # imagen, y por debajo de la música y la voz
  end_fade: 1.5               # fundido de cierre del audio al final (segundos)
  # Respiración estilo documental (narración propia): los espacios en blanco
  # se insertan SOLO dentro de las pausas naturales de tu grabación — la voz
  # nunca se corta a destiempo.
  intro_seconds: 0.8         # aire antes de la primera palabra
  outro_seconds: 2.0         # cola tras la última palabra (el fundido final
                             # nunca toca la voz; antes 3.5s + 3s de fundido
                             # dejaban casi todo el cierre en silencio)
  scene_breath: 0.3          # respiro base entre escenas (se suma a pause_after)
  max_pause: 1.2             # tope de las pausas naturales de tu grabación en
                             # el video (se COMPRIMEN saltando solo silencio
                             # medido, nunca voz; el ritmo/pace por escena del
                             # director lo escala: ligado acorta, amplio da aire)
  cut_guard: 0.20            # guarda TRAS la palabra anterior al recortar una
                             # pausa (su cola decae rápido: borde fiable). El
                             # recorte arranca aquí, por el FRENTE del silencio
  onset_guard: 0.45          # guarda ANTES del arranque de la palabra
                             # siguiente: una fricativa suave (la «s» de «Su»)
                             # queda por debajo de cualquier umbral 100-250 ms,
                             # así que su borde medido llega tarde — este margen
                             # amplio evita comerse ese arranque (súbelo a
                             # 0.55-0.6 si aún oyeras algún recorte)
  deep_silence_db: -55       # umbral de silencio PROFUNDO para reubicar la
                             # pausa que AMPLÍA el director, sin partir una
                             # respiración o una «s» suave por la mitad
  sentence_breath: 0.18      # respiro base al final de cada frase DENTRO de la
                             # escena, escalado por el ritmo (pace) que elige el
                             # director: ligado=0 · normal=1x · amplio=1.7x.
                             # Siempre en huecos entre palabras (nunca corta voz)
  final_gain_db: 1.0         # ganancia fija de acabado de la mezcla (la voz ya
                             # viene normalizada; esto la lleva a ~-14 LUFS,
                             # apta para YouTube, SIN el loudnorm dinámico que
                             # hundía la voz en las pausas dramáticas)
  final_limit: 0.9           # tope del limitador de picos final (0.9 ≈ -0.9 dB)
  # Modo "narración propia" (cuando subes tu voz grabada):
  fix_narration: true        # CORRIGE los tropiezos evidentes de tu grabación:
                             # falsos arranques («El registró… El registro
                             # veterinario oficial es…»), palabras repetidas,
                             # muletillas aisladas y correcciones que anuncias
                             # («voy de nuevo», «corrijo»). Corta el AUDIO
                             # además del texto y avisa de cada corrección.
  fix_narration_ai: true     # además de las reglas, una revisión con IA que
                             # caza los tropiezos reformulados (cuesta unos
                             # centavos por video). Ponlo en false para
                             # quedarte solo con la detección por reglas.
                             # La IA solo corta con seguridad ALTA, y nunca
                             # conectores («es decir», «o sea») ni frases
                             # retomadas lejos del original.
  polish_transcript: true    # corrige POR CONTEXTO los términos que Whisper
                             # oye mal («macacos rhesus» → «masivos») en el
                             # texto y los subtítulos — el audio no se toca,
                             # y avisa de cada corrección.
  trim_silence: true         # recorta el silencio SOLO al inicio y al final
                             # (deja 0.25s de aire). Los silencios internos se
                             # conservan SIEMPRE: recortarlos podía comerse
                             # sílabas suaves — el director los gestiona.
  silence_keep: 0.4          # (histórico, ya sin efecto interno)
subtitles:
  max_chars_per_line: 32   # estilo cine: líneas cortas. El subtítulo se corta
  max_lines: 2             # además al terminar cada oración/cláusula, así el
                           # texto en pantalla es una frase breve acorde a lo
                           # que se dice, no un párrafo (subir a 40 si prefieres
                           # bloques algo más largos)
  font: Arial          # familia para subtítulos quemados (Arial existe en Win/Mac;
                       # en Linux fontconfig la sustituye automáticamente)
  font_size: 54
publish:
  enabled: false
  privacy: private
  category_id: '27'

# ── Torre de Control (panel multicanal: python -m ytpanel ui) ──────────────
panel:
  port: 8766               # ytstudio usa 8765; el panel vive al lado
  history_days: 90         # histórico que trae la PRIMERA sincronización
  resync_overlap_days: 3   # Analytics re-consolida los últimos días: se re-piden
  max_recent_videos: 50    # últimos videos por canal en cada sync
  quota_budget: 10000      # cuota diaria de la Data API (para el medidor)
  quota_reserve: 500       # unidades que la cola de ediciones NUNCA gasta:
                           # quedan reservadas para el sync nocturno de métricas
  currency: USD            # moneda de los ingresos estimados
  alertas:                 # umbrales de los avisos automáticos del panel
    caida_vistas_pct: 25       # % de caída (7 días contra los 7 anteriores)
    subida_vistas_pct: 40      # % de subida que merece que te avisen
    caida_ingresos_pct: 25
    dias_sin_publicar: 21      # canal apagado
    dias_sin_sincronizar: 3
    video_despunta_x: 2.0      # veces la mediana de vistas del canal
    minimo_vistas: 100         # por debajo, los porcentajes son ruido
