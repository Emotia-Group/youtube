<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Control — panel multicanal</title>
<style>
  /* Tokens (claro por defecto; el oscuro redefine SOLO tokens) */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #a8372b;            /* garnet: SOLO cromo de la UI, nunca series */
    --accent-ink: #ffffff;
    --wash: rgba(168,55,43,0.07);
    --serie-vistas: #2a78d6;      /* paleta de datos validada (slot azul) */
    --serie-ingresos: #008300;    /* slot verde (igual en ambos temas) */
    --delta-buena: #006300;
    --critico: #d03b3b;
    --aviso: #b07d10;
    --bueno: #0ca30c;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #e06a5b;
      --accent-ink: #241210;
      --wash: rgba(224,106,91,0.10);
      --serie-vistas: #3987e5;
      --serie-ingresos: #008300;
      --delta-buena: #0ca30c;
      --critico: #e66767;
      --aviso: #d9a544;
      --bueno: #0ca30c;
      --chip-bg: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #e06a5b;
    --accent-ink: #241210;
    --wash: rgba(224,106,91,0.10);
    --serie-vistas: #3987e5;
    --serie-ingresos: #008300;
    --delta-buena: #0ca30c;
    --critico: #e66767;
    --aviso: #d9a544;
    --bueno: #0ca30c;
    --chip-bg: #262624;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  :is(a, button, [tabindex]):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ── Barra superior ── */
  header {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 0; flex-wrap: wrap; }
  .marca { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .marca .v { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .estado-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 2px 9px; border-radius: 99px;
    background: var(--chip-bg); color: var(--ink-2); white-space: nowrap;
  }
  .chip.critico { color: var(--critico); background: color-mix(in srgb, var(--critico) 12%, transparent); }
  .chip.bueno   { color: var(--bueno);   background: color-mix(in srgb, var(--bueno) 12%, transparent); }
  .chip.aviso   { color: var(--aviso);   background: color-mix(in srgb, var(--aviso) 14%, transparent); }
  .crece { flex: 1; }
  .btn {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    padding: 7px 14px;
  }
  .btn:hover { background: var(--wash); }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primario:hover { filter: brightness(1.06); }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* ── Banner de sync ── */
  #sync-banner {
    display: none; padding: 7px 0; font-size: 13px; color: var(--ink-2);
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  #sync-banner.activo { display: block; }
  #sync-banner .punto {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-right: 8px;
    animation: latido 1.2s ease-in-out infinite;
  }
  @keyframes latido { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #sync-banner .punto { animation: none; } }

  /* ── KPIs ── */
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin: 22px 0;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px 14px;
  }
  .kpi .etiqueta { font-size: 12px; color: var(--muted); }
  .kpi .valor { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin-top: 2px; }
  .kpi .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .delta-arriba { color: var(--delta-buena); }
  .delta-abajo { color: var(--critico); }
  .medidor { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 8px; overflow: hidden; }
  .medidor > i { display: block; height: 100%; background: var(--accent); }
  .medidor.alerta > i { background: var(--critico); }

  /* ── Tarjetas de canal ── */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 14px; padding-bottom: 40px;
  }
  .tarjeta {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .tarjeta .cabeza { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: var(--chip-bg); color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .quien { min-width: 0; }
  .quien .nombre { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quien .handle { font-size: 12px; color: var(--muted); }
  .cifras { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .cifra .n { font-size: 20px; font-weight: 700; }
  .cifra .t { font-size: 11px; color: var(--muted); display: block; }
  .spark { position: relative; }
  .spark svg { display: block; width: 100%; height: 56px; }
  .mini-fila { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .mini-fila b { color: var(--ink); font-weight: 650; }
  .ultimo { font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--grid); padding-top: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pie-tarjeta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }

  /* ── Detalle ── */
  .volver { margin: 18px 0 6px; }
  .det-cabeza { display: flex; align-items: center; gap: 14px; margin: 8px 0 18px; flex-wrap: wrap; }
  .det-cabeza .avatar { width: 54px; height: 54px; font-size: 18px; }
  .det-cabeza h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .rango { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .rango button { border: 0; background: var(--surface); color: var(--ink-2); padding: 6px 12px; font-size: 13px; }
  .rango button + button { border-left: 1px solid var(--border); }
  .rango button.activo { background: var(--wash); color: var(--ink); font-weight: 600; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 10px; font-weight: 650; }
  .panel h2 .nota { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 190px; }
  .sin-datos { color: var(--muted); font-size: 13px; padding: 12px 0; }

  .tabla-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .celda-video { display: flex; align-items: center; gap: 10px; min-width: 240px; }
  .celda-video img { width: 60px; height: 34px; object-fit: cover; border-radius: 4px; background: var(--chip-bg); }
  .celda-video .tit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }

  /* ── Onboarding vacío ── */
  .vacio { max-width: 620px; margin: 48px auto; text-align: left; }
  .vacio h1 { font-size: 24px; letter-spacing: -0.01em; }
  .vacio ol { padding-left: 0; list-style: none; counter-reset: paso; margin: 24px 0; }
  .vacio li {
    counter-increment: paso; display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .vacio li::before {
    content: counter(paso); flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .vacio .paso-tit { font-weight: 650; }
  .vacio .paso-des { font-size: 13.5px; color: var(--ink-2); }
  .demo-linea { color: var(--muted); font-size: 13.5px; margin-top: 18px; }

  /* ── Tooltip compartido ── */
  #tooltip {
    position: fixed; pointer-events: none; z-index: 50; display: none;
    background: var(--ink); color: var(--page);
    font-size: 12px; padding: 5px 9px; border-radius: 6px; white-space: nowrap;
  }
  #tooltip b { font-variant-numeric: tabular-nums; }

  /* ── Aviso flotante ── */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--page); padding: 9px 16px;
    border-radius: 8px; font-size: 13.5px; display: none; z-index: 60;
    max-width: 90vw;
  }

  footer { color: var(--muted); font-size: 12.5px; padding: 18px 0 40px; }
  footer .sep { margin: 0 8px; }

  /* ── Edición (fase 2) ── */
  .chip.clicable { cursor: pointer; }
  .chip.clicable:hover { filter: brightness(1.08); }
  .btn.mini { padding: 3px 9px; font-size: 12.5px; }
  .editor {
    background: var(--wash); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin: 6px 0 10px;
  }
  .editor .campo { margin-bottom: 12px; }
  .editor label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .editor input[type=text], .editor textarea, .lote-bar input[type=text],
  .lote-bar select, .editor select {
    width: 100%; box-sizing: border-box;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; font: inherit;
  }
  .editor textarea { min-height: 110px; resize: vertical; }
  .contador { font-size: 11px; color: var(--muted); text-align: right;
              font-variant-numeric: tabular-nums; }
  .contador.excedido { color: var(--critico); font-weight: 700; }
  .editor .filas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mini-preview { width: 120px; height: 68px; object-fit: cover; border-radius: 6px;
                  border: 1px solid var(--border); background: var(--chip-bg); }
  /* [hidden] pierde contra display:flex de la clase; que gane siempre */
  .lote-bar[hidden], #pl-editor[hidden] { display: none; }
  .lote-bar {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    background: var(--wash); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .lote-bar .campo { min-width: 170px; flex: 1; }
  .lote-preview { font-size: 13px; margin-top: 10px; }
  .lote-preview li { margin-bottom: 3px; }
  .lote-preview .antes { color: var(--muted); text-decoration: line-through; }
  .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .badge.pendiente { color: var(--aviso); background: color-mix(in srgb, var(--aviso) 14%, transparent); }
  .badge.en_curso { color: var(--serie-vistas); background: color-mix(in srgb, var(--serie-vistas) 12%, transparent); }
  .badge.hecho { color: var(--bueno); background: color-mix(in srgb, var(--bueno) 12%, transparent); }
  .badge.error { color: var(--critico); background: color-mix(in srgb, var(--critico) 12%, transparent); }
  .badge.cancelado { color: var(--muted); background: var(--chip-bg); }
  .pl-item { display: flex; align-items: center; gap: 8px; padding: 6px 0;
             border-bottom: 1px solid var(--grid); font-size: 13.5px; }
  .pl-item:last-child { border-bottom: 0; }
  .pl-item .pos { color: var(--muted); font-variant-numeric: tabular-nums; width: 2ch; }
  .pl-item .tit { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nota-celda { max-width: 40ch; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  td .btn.mini + .btn.mini { margin-left: 6px; }
  #tabla-videos:not(.lote) .chk { display: none; }
  #tabla-videos .chk { width: 26px; }
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <span class="marca">🎛️ Torre de Control<span class="v" id="version"></span></span>
    <span class="estado-chips" id="estado-chips"></span>
    <span class="crece"></span>
    <button class="btn" id="btn-sync" aria-label="Sincronizar todos los canales">⟳ Sincronizar</button>
    <button class="btn primario" id="btn-conectar">＋ Conectar canal</button>
  </div>
  <div id="sync-banner"><div class="wrap"><span class="punto"></span><span id="sync-linea">Sincronizando…</span></div></div>
</header>

<main class="wrap" id="app" aria-live="polite">
  <p style="color:var(--muted);margin-top:32px">Cargando…</p>
</main>

<div id="tooltip" role="presentation"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app"), tooltip = $("#tooltip");
let OVERVIEW = null;
let VISTA = { tipo: "inicio", canal: null, days: 90 };
let SYNC_TIMER = null;

/* ── Formatos (es-ES) ── */
const fInt = n => (n ?? 0).toLocaleString("es-ES");
const fCompact = n => n >= 1e6 ? (n / 1e6).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " M"
                  : n >= 1e4 ? (n / 1e3).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " mil"
                  : fInt(n);
const fMoney = n => n == null ? "—" :
  "US$ " + n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fFecha = iso => { if (!iso) return "—"; const d = new Date(iso.slice(0, 10) + "T12:00:00");
  return d.getDate() + " " + MESES[d.getMonth()]; };
const fDur = s => { const m = Math.floor(s / 60), r = s % 60;
  return m + ":" + String(r).padStart(2, "0"); };
const esc = t => String(t ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function deltaHTML(actual, previo, fmt = fCompact) {
  if (previo == null || actual == null || previo === 0) return "";
  const pct = (actual - previo) / previo * 100;
  if (!isFinite(pct)) return "";
  const arriba = pct >= 0;
  return `<span class="${arriba ? "delta-arriba" : "delta-abajo"}" title="vs. periodo anterior">` +
         `${arriba ? "▲" : "▼"} ${Math.abs(pct).toLocaleString("es-ES", { maximumFractionDigits: 1 })}%</span>`;
}

/* ── Charts SVG (una serie por gráfico; sin doble eje jamás) ── */
function pathDe(points, W, H, pad, maxY) {
  const n = points.length;
  const x = i => pad + (n === 1 ? (W - 2 * pad) / 2 : i / (n - 1) * (W - 2 * pad));
  const y = v => H - pad - (maxY ? (v / maxY) * (H - 2 * pad) : 0);
  return { x, y, d: points.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ") };
}

function lineChart(el, serie, { key, color, alto = 190, fmt = fInt, ejes = true }) {
  const datos = serie.map(d => ({ date: d.date, v: d[key] ?? 0 }));
  if (!datos.length) { el.innerHTML = '<p class="sin-datos">Sin datos todavía.</p>'; return; }
  const W = 900, H = alto, pad = ejes ? 26 : 6;
  const maxY = Math.max(...datos.map(d => d.v), 1) * 1.05;
  const { x, y, d } = pathDe(datos.map(p => p.v), W, H, pad, maxY);
  const base = (H - pad).toFixed(1);
  let g = "";
  if (ejes) {
    for (let i = 1; i <= 3; i++) {
      const gy = (pad + (H - 2 * pad) * (1 - i / 3)).toFixed(1);
      g += `<line x1="${pad}" x2="${W - pad}" y1="${gy}" y2="${gy}" style="stroke:var(--grid)" stroke-width="1"/>`;
    }
  }
  const fin = datos[datos.length - 1];
  el.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Serie diaria">
      ${g}
      <line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" style="stroke:var(--baseline)" stroke-width="1"/>
      <path d="${d} L ${x(datos.length - 1).toFixed(1)} ${base} L ${x(0).toFixed(1)} ${base} Z"
            style="fill:${color}" opacity="0.10"/>
      <path d="${d}" style="stroke:${color}" stroke-width="2" fill="none"
            stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(datos.length - 1).toFixed(1)}" cy="${y(fin.v).toFixed(1)}" r="3.4" style="fill:${color}"/>
      <line id="cruz" x1="0" x2="0" y1="${pad}" y2="${base}" style="stroke:var(--baseline)"
            stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="punto" r="3.4" style="fill:${color}" visibility="hidden"/>
    </svg>` + (ejes ?
    `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">
       <span>${fFecha(datos[0].date)}</span>
       <span>máx. ${fmt(Math.round(maxY / 1.05))}</span>
       <span>${fFecha(fin.date)}</span></div>` : "");
  const svg = el.querySelector("svg");
  const cruz = svg.querySelector("#cruz"), punto = svg.querySelector("#punto");
  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(datos.length - 1,
      Math.round((fx - pad) / (W - 2 * pad) * (datos.length - 1))));
    const px = x(i), py = y(datos[i].v);
    cruz.setAttribute("x1", px); cruz.setAttribute("x2", px);
    cruz.setAttribute("visibility", "visible");
    punto.setAttribute("cx", px); punto.setAttribute("cy", py);
    punto.setAttribute("visibility", "visible");
    tooltip.style.display = "block";
    tooltip.innerHTML = `${fFecha(datos[i].date)} · <b>${fmt(datos[i].v)}</b>`;
    tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, ev.clientX + 14) + "px";
    tooltip.style.top = (ev.clientY - 34) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    cruz.setAttribute("visibility", "hidden");
    punto.setAttribute("visibility", "hidden");
    tooltip.style.display = "none";
  });
}

/* ── Estado y chips ── */
function chipsEstado(e) {
  const chips = [];
  if (!e.client_secrets)
    chips.push(`<span class="chip aviso" title="Falta client_secrets.json en la carpeta del programa">⚠ Falta client_secrets.json</span>`);
  chips.push(e.cifrado
    ? `<span class="chip" title="Los tokens se guardan cifrados en panel_data/">🔒 Tokens cifrados</span>`
    : `<span class="chip aviso" title="Instala el paquete cryptography para cifrar los tokens">⚠ Tokens sin cifrar</span>`);
  const uso = e.cuota_hoy, tope = e.quota_budget || 10000;
  chips.push(`<span class="chip" title="Unidades de la Data API gastadas hoy por este panel (las métricas de Analytics no gastan de aquí)">
    Cuota hoy: ${fInt(uso)} / ${fInt(tope)}</span>`);
  const cola = e.cola || {};
  const nCola = (cola.pendientes || 0) + (cola.errores || 0);
  const claseCola = cola.errores ? "critico" : (cola.pendientes ? "aviso" : "");
  chips.push(`<span class="chip clicable ${claseCola}" id="chip-cola" role="button" tabindex="0"
    title="Cola de ediciones: ver estado, reintentar o cancelar">
    ${cola.running ? "⏳" : "📋"} Cola: ${cola.pendientes || 0} pendiente(s)${cola.errores ? ` · ${cola.errores} error(es)` : ""}</span>`);
  return chips.join("");
}

function estadoChipCanal(c) {
  const chips = [];
  if (c.is_demo) chips.push(`<span class="chip">◌ demo</span>`);
  if (c.token_status === "reauth")
    chips.push(`<span class="chip critico" title="La autorización caducó o fue revocada: vuelve a conectar el canal">⚠ Reconectar</span>`);
  else if (c.token_status === "sin_token")
    chips.push(`<span class="chip aviso">⚠ Sin token</span>`);
  else if (!c.is_demo)
    chips.push(`<span class="chip bueno">✔ Al día</span>`);
  return chips.join(" ");
}

    <div class="panel"><h2>Ingresos estimados por día
      <span class="nota">${conIngresos ? "US$ · se ajustan a fin de mes; la cifra de pago vive en AdSense" : ""}</span></h2>

      <span class="soft" style="font-size:12.5px">o edita un video con el lápiz ✎ de su fila</span></div>
    <div class="lote-bar" id="lote-bar" hidden></div>`}

        <tbody>${det.videos.map(v => filaVideo(v, esDemo)).join("") ||
          `<tr><td colspan="8" class="sin-datos">Sin videos sincronizados todavía.</td></tr>`}
        </tbody></table></div></div>

    <div class="panel"><h2>Playlists
      <span class="nota">${esDemo ? "solo lectura en demo" : "los cambios pasan por la cola"}</span></h2>
      <div id="pl-lista">${det.playlists.length ? det.playlists.map(p => `
        <div class="pl-item" data-pid="${esc(p.playlist_id)}">
          <span class="tit"><b>${esc(p.title)}</b> · ${fInt(p.item_count)} videos · ${esc(p.privacy || "—")}</span>
          ${esDemo ? "" : `<button class="btn mini" data-abrir-pl="${esc(p.playlist_id)}" data-titulo="${esc(p.title)}">Abrir</button>`}

      b.addEventListener("click", () => abrirPlaylist(b.dataset.abrirPl, b.dataset.titulo)));
  }

/* ── Editor de un video ── */
function abrirEditor(videoId) {
  const fila = document.querySelector(`tr[data-vid="${CSS.escape(videoId)}"]`);
  const v = DET.det.videos.find(x => x.video_id === videoId);
  if (!fila || !v) return;
  const previa = fila.nextElementSibling;
  if (previa && previa.classList.contains("editor-tr")) { previa.remove(); return; }
  document.querySelectorAll(".editor-tr").forEach(e => e.remove());
  const tr = document.createElement("tr");
  tr.className = "editor-tr";
  tr.innerHTML = `<td colspan="8"><div class="editor">
    <div class="campo"><label for="ed-titulo">Título</label>
      <input type="text" id="ed-titulo" value="${esc(v.title)}">
      <div class="contador" id="ed-titulo-n"></div></div>
    <div class="campo"><label for="ed-descr">Descripción</label>
      <textarea id="ed-descr">${esc(v.description)}</textarea>
      <div class="contador" id="ed-descr-n"></div></div>
    <div class="campo"><label for="ed-tags">Etiquetas (separadas por comas)</label>
      <input type="text" id="ed-tags" value="${esc(v.tags.join(", "))}">
      <div class="contador" id="ed-tags-n"></div></div>
    <div class="campo"><label>Miniatura nueva (opcional · JPG/PNG hasta 2 MB · requiere canal verificado por teléfono)</label>
      <div class="filas">
        <img class="mini-preview" id="ed-mini-prev" alt=""
             ${v.thumbnail_url ? `src="${esc(v.thumbnail_url)}"` : ""}>
        <input type="file" id="ed-mini" accept="image/jpeg,image/png">
      </div></div>
    <div class="filas">
      <button class="btn primario mini" id="ed-guardar">Guardar cambios</button>
      <button class="btn mini" id="ed-cerrar">Cancelar</button>
      <span class="soft" style="font-size:12px">Se aplica por la cola (~51 unidades de cuota; +50 la miniatura)</span>
    </div></div></td>`;
  fila.after(tr);
  let imagen = null;   // {b64, mime}
  const bytes = t => new TextEncoder().encode(t).length;
  const contar = () => {
    const t = $("#ed-titulo").value, d = $("#ed-descr").value;
    const tags = $("#ed-tags").value.split(",").map(x => x.trim()).filter(Boolean);
    const suma = tags.reduce((a, x) => a + x.length + 2, 0);
    ponContador("#ed-titulo-n", t.length, 100, " caracteres");
    ponContador("#ed-descr-n", bytes(d), 5000, " bytes");
    ponContador("#ed-tags-n", suma, 480, " caracteres en total");
  };
  ["#ed-titulo", "#ed-descr", "#ed-tags"].forEach(s =>
    $(s).addEventListener("input", contar));
  contar();
  $("#ed-mini").addEventListener("change", ev => {
    const f = ev.target.files[0];
    imagen = null;
    if (!f) return;
    if (!["image/jpeg", "image/png"].includes(f.type)) {
      aviso("La miniatura debe ser JPG o PNG."); ev.target.value = ""; return;
    }
    if (f.size > 2 * 1024 * 1024) {
      aviso(`Esa imagen pesa ${(f.size / 1024 / 1024).toFixed(1)} MB; YouTube admite 2 MB.`);
      ev.target.value = ""; return;
    }
    const lector = new FileReader();
    lector.onload = () => {
      $("#ed-mini-prev").src = lector.result;
      imagen = { b64: lector.result.split(",")[1], mime: f.type };
    };
    lector.readAsDataURL(f);
  });
  $("#ed-cerrar").addEventListener("click", () => tr.remove());
  $("#ed-guardar").addEventListener("click", async () => {
    const cuerpo = { channel_id: DET.channelId, video_id: videoId };
    const t = $("#ed-titulo").value, d = $("#ed-descr").value;
    const tags = $("#ed-tags").value.split(",").map(x => x.trim()).filter(Boolean);
    if (t !== v.title) cuerpo.title = t;
    if (d !== v.description) cuerpo.description = d;
    if (JSON.stringify(tags) !== JSON.stringify(v.tags)) cuerpo.tags = tags;
    if (imagen) { cuerpo.image_b64 = imagen.b64; cuerpo.image_mime = imagen.mime; }
    if (!("title" in cuerpo) && !("description" in cuerpo)
        && !("tags" in cuerpo) && !imagen) { aviso("No hay cambios."); return; }
    const r = await fetch("/api/edits", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    const data = await r.json();
    if (!r.ok) { aviso(data.error || "No se pudo encolar.", 8000); return; }
    tr.remove();
    aviso(`Cambios encolados (${data.jobs.length} trabajo/s). La cola los aplica ya.`);
    vigilarCola(() => { if (VISTA.tipo === "detalle") abrirDetalle(DET.channelId); });
  });
}

function ponContador(sel, n, tope, sufijo) {
  const el = $(sel);
  el.textContent = `${fInt(n)} / ${fInt(tope)}${sufijo}`;
  el.classList.toggle("excedido", n > tope);
}

    else if (op === "agregar_etiquetas") z.innerHTML =
      `<input type="text" id="lp-tags" placeholder="etiquetas nuevas, separadas por comas">`;
    else z.innerHTML = `<select id="lp-playlist">${DET.det.playlists.map(p =>
      `<option value="${esc(p.playlist_id)}">${esc(p.title)}</option>`).join("")
      || `<option value="">(este canal no tiene playlists)</option>`}</select>`;
    $("#lote-out").innerHTML = ""; $("#lote-encolar").disabled = true;
  };
  $("#lote-op").addEventListener("change", params);
  params();
  $("#lote-preview").addEventListener("click", previewLote);
  $("#lote-encolar").addEventListener("click", encolarLote);
}

function loteParams() {
  const op = $("#lote-op").value;
  if (op === "reemplazar") return { campo: $("#lp-campo").value,
    buscar: $("#lp-buscar").value, reemplazo: $("#lp-reemplazo").value };
  if (op === "anexar_descripcion") return { texto: $("#lp-texto").value };
  if (op === "agregar_etiquetas") return { tags: $("#lp-tags").value
    .split(",").map(t => t.trim()).filter(Boolean) };
  return { playlist_id: $("#lp-playlist").value };
}

function previewLote() {
  const out = $("#lote-out");
  if (!DET.sel.size) { out.innerHTML = "Marca al menos un video (casillas de la izquierda)."; return; }
  const op = $("#lote-op").value, p = loteParams();
  const vids = DET.det.videos.filter(v => DET.sel.has(v.video_id));
  let filas = [], aplicables = 0;
  for (const v of vids) {
    if (op === "reemplazar") {
      if (!p.buscar || !v[p.campo].includes(p.buscar)) {
        filas.push(`<li><span class="antes">${esc(v.title)}</span> — no contiene «${esc(p.buscar)}»</li>`);
        continue;
      }
      aplicables++;
      const despues = p.campo === "title"
        ? v.title.replace(p.buscar, p.reemplazo)
        : v.title + " (descripción modificada)";
      filas.push(`<li><span class="antes">${esc(v.title)}</span> → <b>${esc(despues)}</b></li>`);
    } else if (op === "agregar_a_playlist") {
      aplicables++; filas.push(`<li>${esc(v.title)} → playlist</li>`);
    } else {
      aplicables++; filas.push(`<li>${esc(v.title)}</li>`);
    }
  }
  const costo = aplicables * (op === "agregar_a_playlist" ? 50 : 51);
  out.innerHTML = `<ul>${filas.slice(0, 8).join("")}</ul>
    ${filas.length > 8 ? `…y ${filas.length - 8} más. ` : ""}
    <b>${aplicables}</b> cambio(s) aplicable(s) · costo estimado ${fInt(costo)} unidades de cuota.
    ${aplicables ? "Revisa y pulsa «Encolar»." : ""}`;
  $("#lote-encolar").disabled = !aplicables;
}

async function encolarLote() {
  const r = await fetch("/api/edits/lote", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channel_id: DET.channelId,
      video_ids: [...DET.sel], operacion: $("#lote-op").value,
      params: loteParams() }) });
  const data = await r.json();
  if (!r.ok) { aviso(data.error || "No se pudo encolar el lote.", 8000); return; }
  const motivos = (data.omitidos || []).slice(0, 3)
    .map(o => o.motivo).join("; ");
  aviso(`Lote encolado: ${data.creados.length} trabajo(s)`
    + (data.omitidos.length ? ` · ${data.omitidos.length} omitido(s) (${motivos}…)` : "."), 7000);
  vigilarCola(() => { if (VISTA.tipo === "detalle") abrirDetalle(DET.channelId); });
}

/* ── Playlists ── */
async function crearPlaylist() {
  const titulo = $("#pl-nueva-titulo").value.trim();
  if (!titulo) { aviso("Ponle un título a la playlist."); return; }
  const r = await fetch("/api/playlists", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channel_id: DET.channelId, titulo,
      privacidad: $("#pl-nueva-priv").value }) });
  const data = await r.json();
  if (!r.ok) { aviso(data.error || "No se pudo crear.", 8000); return; }
  aviso("Playlist encolada; aparecerá en segundos.");
  vigilarCola(() => { if (VISTA.tipo === "detalle") abrirDetalle(DET.channelId); });
}

async function abrirPlaylist(pid, titulo) {
  const zona = $("#pl-editor");
  zona.hidden = false;
  zona.innerHTML = `<p class="soft">Cargando «${esc(titulo)}»…</p>`;
  const r = await fetch(`/api/channel/${DET.channelId}/playlist/${pid}/items`);
  const data = await r.json();
  if (!r.ok) { zona.innerHTML = `<p class="sin-datos">${esc(data.error || "No se pudo leer la playlist.")}</p>`; return; }
  const enLista = new Set(data.items.map(i => i.video_id));
  const candidatos = DET.det.videos.filter(v => !enLista.has(v.video_id));
  zona.innerHTML = `<div class="editor">
    <div class="filas" style="justify-content:space-between">
      <b>${esc(titulo)}</b>
      <button class="btn mini" id="pl-cerrar">Cerrar</button></div>
    <div style="margin:10px 0">${data.items.map((it, i) => `
      <div class="pl-item">
        <span class="pos">${i + 1}</span><span class="tit">${esc(it.title)}</span>
        <button class="btn mini" data-pl-mv="-1" data-item="${esc(it.item_id)}"
          data-vid="${esc(it.video_id)}" data-pos="${it.position}" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn mini" data-pl-mv="1" data-item="${esc(it.item_id)}"
          data-vid="${esc(it.video_id)}" data-pos="${it.position}"
          ${i === data.items.length - 1 ? "disabled" : ""}>↓</button>
        <button class="btn mini" data-pl-quitar="${esc(it.item_id)}" title="Quitar de la playlist">✕</button>
      </div>`).join("") || `<p class="sin-datos">La playlist está vacía.</p>`}</div>
    <div class="filas">
      <select id="pl-add-vid" style="flex:1">${candidatos.map(v =>
        `<option value="${esc(v.video_id)}">${esc(v.title)}</option>`).join("")
        || `<option value="">(todos los videos ya están)</option>`}</select>
      <button class="btn mini" id="pl-add">＋ Añadir</button></div></div>`;
  $("#pl-cerrar").addEventListener("click", () => { zona.hidden = true; zona.innerHTML = ""; });
  const refrescar = () => vigilarCola(() => abrirPlaylist(pid, titulo));
  zona.querySelectorAll("[data-pl-quitar]").forEach(b => b.addEventListener("click", async () => {
    await postJson("/api/playlist/remove", { channel_id: DET.channelId,
      item_id: b.dataset.plQuitar }); refrescar();
  }));
  zona.querySelectorAll("[data-pl-mv]").forEach(b => b.addEventListener("click", async () => {
    const nueva = Math.max(0, parseInt(b.dataset.pos, 10) + parseInt(b.dataset.plMv, 10));
    await postJson("/api/playlist/move", { channel_id: DET.channelId,
      playlist_id: pid, item_id: b.dataset.item, video_id: b.dataset.vid,
      position: nueva }); refrescar();
  }));
  $("#pl-add").addEventListener("click", async () => {
    const vid = $("#pl-add-vid").value;
    if (!vid) return;
    await postJson("/api/playlist/add", { channel_id: DET.channelId,
      playlist_id: pid, video_id: vid }); refrescar();
  });
}

async function postJson(ruta, cuerpo) {
  const r = await fetch(ruta, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
  const data = await r.json();
  if (!r.ok) { aviso(data.error || "La operación falló.", 8000); throw new Error(data.error); }
  aviso("Encolado; aplicando…");
  return data;
}

/* ── Cola ── */
let COLA_TIMER = null;
function vigilarCola(alTerminar) {
  if (COLA_TIMER) { COLA_TIMER.cbs.push(alTerminar || (() => {})); return; }
  COLA_TIMER = { cbs: [alTerminar || (() => {})] };
  COLA_TIMER.id = setInterval(async () => {
    const r = await fetch("/api/jobs?estado=en_curso");
    const s = await r.json();
    if (!s.running) {
      clearInterval(COLA_TIMER.id);
      const cbs = COLA_TIMER.cbs;
      COLA_TIMER = null;
      const rj = await fetch("/api/jobs?estado=error");
      const errores = (await rj.json()).jobs.length;
      aviso(errores ? `Cola procesada con ${errores} error(es); ábrela desde la cabecera.`
                    : "Cola procesada: cambios aplicados en YouTube.");
      const ov = await fetch("/api/overview");
      OVERVIEW = await ov.json();
      $("#estado-chips").innerHTML = chipsEstado(OVERVIEW.estado);
      cbs.forEach(cb => cb());
    }
  }, 1500);
}

async function renderCola() {
  VISTA = { tipo: "cola", days: VISTA.days };
  const r = await fetch("/api/jobs");
  const data = await r.json();
  app.innerHTML = `
    <div class="volver"><a href="#" id="volver-cola">← Todos los canales</a></div>
    <div class="det-cabeza"><h1>Cola de ediciones</h1><span class="crece"></span>
      <button class="btn mini" id="cola-procesar">▶ Procesar ahora</button></div>
    <div class="panel"><div class="tabla-scroll"><table>
      <thead><tr><th>#</th><th>Canal</th><th>Trabajo</th><th>Estado</th>
        <th>Nota</th><th class="num">Intentos</th><th>Actualizado</th><th></th></tr></thead>
      <tbody>${data.jobs.map(j => `<tr>
        <td class="num">${j.id}</td>
        <td>${esc(j.canal)}</td>
        <td>${esc(j.etiqueta)}</td>
        <td><span class="badge ${esc(j.status)}">${esc(j.status.replace("_", " "))}</span></td>
        <td class="nota-celda" title="${esc(j.nota)}">${esc(j.nota)}</td>
        <td class="num">${j.attempts}</td>
        <td>${esc(j.updated_at)}</td>
        <td>${["error", "cancelado"].includes(j.status)
            ? `<button class="btn mini" data-job-retry="${j.id}">Reintentar</button>` : ""}
           ${j.status === "pendiente"
            ? `<button class="btn mini" data-job-cancel="${j.id}">Cancelar</button>` : ""}</td>
      </tr>`).join("") ||
        `<tr><td colspan="8" class="sin-datos">La cola está vacía: todo lo encolado ya se aplicó.</td></tr>`}
      </tbody></table></div></div>
    <p class="soft" style="font-size:12.5px">Los trabajos «en espera por cuota» se
    reanudan solos tras el reinicio diario de cuota (medianoche, hora del Pacífico).</p>`;
  $("#volver-cola").addEventListener("click", ev => { ev.preventDefault(); cargar(); });
  $("#cola-procesar").addEventListener("click", async () => {
    await fetch("/api/cola/procesar", { method: "POST" });
    vigilarCola(() => { if (VISTA.tipo === "cola") renderCola(); });
  });
  app.querySelectorAll("[data-job-retry]").forEach(b => b.addEventListener("click", async () => {
    await fetch(`/api/jobs/${b.dataset.jobRetry}/reintentar`, { method: "POST" });
    vigilarCola(() => { if (VISTA.tipo === "cola") renderCola(); });
    renderCola();
  }));
  app.querySelectorAll("[data-job-cancel]").forEach(b => b.addEventListener("click", async () => {
    await fetch(`/api/jobs/${b.dataset.jobCancel}/cancelar`, { method: "POST" });
    renderCola();
  }));
  if (data.running) vigilarCola(() => { if (VISTA.tipo === "cola") renderCola(); });
}

document.addEventListener("click", ev => {
  if (ev.target.closest("#chip-cola")) renderCola();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.closest && ev.target.closest("#chip-cola")) renderCola();
});

/* ── Acciones ── */
async function conectar() {
  const r = await fetch("/api/oauth/start");
  const data = await r.json();
  if (!r.ok) { aviso(data.error || "No se pudo iniciar la conexión.", 9000); return; }
  window.location.href = data.url;
}

async function sincronizar() {
  const r = await fetch("/api/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const data = await r.json();
  if (!data.started && data.running) aviso("Ya hay una sincronización en marcha.");
  vigilarSync();
}

async function desconectar(channelId, nombre) {
  if (!confirm(`¿Desconectar «${nombre}»?\n\nSe borra su token y todas sus métricas de este equipo. ` +
               `El canal en YouTube no se toca. Podrás reconectarlo cuando quieras.`)) return;
  await fetch(`/api/channel/${channelId}/desconectar`, { method: "POST" });
  await cargar();
}

async function demoCargar(ev) { ev.preventDefault(); await fetch("/api/demo", { method: "POST" }); await cargar(); }
async function demoQuitar(ev) { ev.preventDefault(); await fetch("/api/demo/quitar", { method: "POST" }); await cargar(); }

function vigilarSync() {
  if (SYNC_TIMER) return;
  $("#sync-banner").classList.add("activo");
  SYNC_TIMER = setInterval(async () => {
    const r = await fetch("/api/sync/status");
    const s = await r.json();
    $("#sync-linea").textContent = s.lines.length ? s.lines[s.lines.length - 1] : "Sincronizando…";
    if (!s.running) {
      clearInterval(SYNC_TIMER); SYNC_TIMER = null;
      $("#sync-banner").classList.remove("activo");
      const fallos = (s.result || []).filter(x => x && !x.ok);
      aviso(fallos.length
        ? `Sincronización con ${fallos.length} problema(s); revisa las tarjetas marcadas.`
        : "Sincronización completa.");
      await cargar(true);
    }
  }, 1500);
}

function aviso(texto, ms = 4000) {
  const t = $("#toast");
  t.textContent = texto; t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = "none"; }, ms);
}

/* ── Carga ── */
async function cargar(mantenerVista = false) {
  const r = await fetch("/api/overview");
  OVERVIEW = await r.json();
  if (OVERVIEW.estado.sync.running) vigilarSync();
  if (mantenerVista && VISTA.tipo === "detalle"
      && OVERVIEW.channels.some(c => c.channel_id === VISTA.canal)) {
    await abrirDetalle(VISTA.canal);
  } else {
    VISTA = { tipo: "inicio", days: VISTA.days };
    renderInicio();
  }
}

/* Los enlaces de demo se re-pintan con cada vista: delegación, no cableado */
app.addEventListener("click", ev => {
  const a = ev.target.closest("#cargar-demo, #quitar-demo");
  if (!a) return;
  (a.id === "cargar-demo" ? demoCargar : demoQuitar)(ev);
});

$("#btn-conectar").addEventListener("click", conectar);
$("#btn-sync").addEventListener("click", sincronizar);

const params = new URLSearchParams(location.search);
if (params.get("conectado")) {
  history.replaceState(null, "", "/");
  aviso(`Canal conectado: ${params.get("conectado")}. Trayendo sus primeros datos…`, 6000);
}
cargar();
</script>
